<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="阅读">
<meta name="format-detection" content="telephone=no">
<title>英文阅读</title>
<link rel="icon" type="image/png" sizes="180x180" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f5f1;--ink:#25272b;--mute:#7d8087;--dim:#a8aaae;
  --line:rgba(30,32,38,.09);--chip:rgba(30,32,38,.06);--card:rgba(255,255,255,.72);
  --glass:rgba(252,252,250,.82);--hl:#fdf0b5;
  --sel:rgba(66,106,220,.16);--selline:#4a6fdc;--on:#25272b;--onfg:#fff;--bad:#b4453a;
  --font:26px;--line-height:1.78;--para-gap:.55em;--read-align:left;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --serif:"Literata","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC",serif;
  --reader-font:"Aptos","Source Sans 3","Segoe UI","Calibri","Helvetica Neue","Microsoft YaHei","PingFang SC",Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=sepia]{--paper:#f1e8d2;--ink:#3a3326;--mute:#8a7f66;--dim:#b3a78c;--line:rgba(70,55,20,.12);--chip:rgba(70,55,20,.07);--card:rgba(255,250,235,.6);--glass:rgba(246,238,216,.85);--hl:#f7d98a;--on:#3a3326;--onfg:#f7efd9}
/* 深色：降低对比、偏暖灰蓝，避免纯白字在黑底上的刺眼感 */
:root[data-theme=dark]{color-scheme:dark;--paper:#17191e;--ink:#c3c7cf;--mute:#8b919d;--dim:#646a76;--line:rgba(225,230,245,.12);--chip:rgba(225,230,245,.07);--card:rgba(225,230,245,.05);--glass:rgba(34,38,46,.72);--hl:rgba(201,170,105,.11);--sel:rgba(128,157,226,.20);--selline:#8fa6d6;--on:#b4bccb;--onfg:#171a20;--bad:#d9857d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
:root[data-theme=dark] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{position:fixed;inset:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
svg{display:block;width:100%;height:100%}
#app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
/* 状态栏区域与纸面同色，滚动内容在其下方渐隐，无割裂 */
.topfade{position:absolute;z-index:8;top:0;left:0;right:0;height:calc(var(--st) + 20px);background:linear-gradient(to bottom,var(--paper) 0,var(--paper) var(--st),transparent 100%);pointer-events:none}
main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.panel.active{display:flex}
.page{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 18px) 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1}
.hint{font-size:12px;color:var(--mute);line-height:1.55}
.btn{height:46px;padding:0 16px;border-radius:14px;background:var(--chip);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--on);color:var(--onfg)}
.btn.block{flex:1}
.btn:active{opacity:.7}.btn:disabled{opacity:.45}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.status{min-height:18px;margin-top:10px;font-size:13px;color:var(--mute)}.status.bad{color:var(--bad)}
textarea,input[type=text],input[type=password],input[type=search],select{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--chip);padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea{min-height:36dvh;max-height:52dvh;resize:none;line-height:1.6}
textarea:focus,input:focus,select:focus{border-color:var(--mute)}
.foot{display:flex;justify-content:space-between;margin:8px 2px 12px;font-size:12px;color:var(--mute)}
.field{margin-bottom:12px}.field label{display:block;margin:0 2px 6px;font-size:12px;color:var(--mute);font-weight:600}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.switch-row b{font-size:15px;font-weight:600}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--chip);transition:background .2s;border:1px solid var(--line)}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+i{background:#34c759;border-color:#34c759}.switch input:checked+i::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--on);height:30px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--chip);border-radius:12px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:10px;color:var(--mute)}
.empty{padding:34px 18px;text-align:center;color:var(--mute);font-size:14px;line-height:1.8;border:1px dashed var(--line);border-radius:18px}
.empty .btn{margin-top:12px}
/* 左滑删除 / 右滑分类 */
.swipe{position:relative;overflow:hidden;border-radius:16px}
.swipe .acts{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:stretch;padding:2px;overflow:hidden;border-radius:16px}
.swipe .act{width:88px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;border-radius:13px;letter-spacing:.02em}
.swipe .act.cat{background:#456fd0}.swipe .act.del{background:#c95049}
.swipe .item{position:relative;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);-webkit-user-select:none;user-select:none}
.swipe .item .main{cursor:pointer}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:9px;background:var(--chip);color:var(--ink);font-size:11px;font-weight:600}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--chip);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip.on{background:var(--on);color:var(--onfg)}
.swipe-hint{margin:0 2px 10px;font-size:12px;color:var(--mute)}
/* 弹层（顶部卡片，避免被 iOS 键盘遮挡） */
.mask{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .22s}
.mask.open{opacity:1;pointer-events:auto}
.msheet{position:fixed;z-index:60;left:12px;right:12px;top:calc(var(--st) + 14px);max-width:560px;margin:0 auto;max-height:calc(100dvh - var(--st) - 28px);overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.22);padding:16px;transform:translateY(-130%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.msheet.open{transform:none;pointer-events:auto}
.msheet h3{margin:0 0 10px;font-size:18px}
.msheet textarea{min-height:140px;max-height:36dvh}
.msheet .row input{flex:1;min-width:0}
.cat-list{display:grid;gap:6px}
.cat-opt{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 14px;border-radius:12px;background:var(--chip);font-size:15px;font-weight:600;text-align:left}
.cat-opt.on{background:var(--on);color:var(--onfg)}

/* 阅读 */
#reader-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 20px 48px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
 .article{max-width:720px;margin:0 auto;font-family:var(--reader-font);font-size:var(--font);line-height:var(--line-height);text-align:var(--read-align);letter-spacing:normal;word-spacing:normal;font-kerning:normal;
  color:var(--read-ink,var(--ink));
  hyphens:auto;-webkit-hyphens:auto;-webkit-hyphenate-limit-before:3;-webkit-hyphenate-limit-after:3;hyphenate-limit-chars:6 3 3;
  word-break:normal;overflow-wrap:break-word;text-wrap:pretty;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.para{display:block;width:100%;margin:0 0 var(--para-gap);text-align:inherit;text-justify:inter-word;text-align-last:start;overflow-wrap:break-word;word-spacing:normal}
.sent{border-radius:5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s,color .2s}
.article.focus-on.has-focus .sent:not(.is-focused){color:var(--dim)}
.focus-on .sent.is-focused{background:var(--hl);box-shadow:0 0 0 3px var(--hl)}
.w{border-radius:4px}
.w.sel{color:var(--ink);background:var(--sel);box-shadow:0 0 0 2px var(--sel);text-decoration:underline;text-decoration-color:var(--selline);text-decoration-thickness:2px;text-underline-offset:5px}
.dock{display:none!important}

/* 底部导航 */
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);margin:0 14px max(1.6px,calc(var(--sb)*.2 - 2.4px));padding:5px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);position:relative;z-index:20}
.tab{height:50px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:11px;font-weight:600}
.tab svg{width:23px;height:23px}
.tab.active{color:var(--ink);background:var(--chip)}

/* 收藏 */
.list{display:grid;gap:9px}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.item .main{flex:1;min-width:0;text-align:left}
.item .t{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.mini-progress{display:flex;align-items:center;gap:7px;margin-top:8px;color:var(--mute);font-size:10px;font-variant-numeric:tabular-nums}
.mini-progress span{height:3px;flex:1;overflow:hidden;border-radius:9px;background:var(--chip)}
.mini-progress i{display:block;height:100%;border-radius:inherit;background:var(--selline)}
.mini-progress b{font-weight:600;min-width:28px;text-align:right}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--chip);color:var(--mute);padding:9px;flex:none;font-size:15px}

/* 查词面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:900px;margin:0 auto;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.16);padding:8px 16px calc(var(--sb) + 12px);transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-height:62dvh;display:flex;flex-direction:column}
.sheet.open{transform:none;pointer-events:auto}
.grab{position:relative;touch-action:none;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;flex:none}
.grab::before{content:"";position:absolute;left:-70px;right:-70px;top:-10px;bottom:-14px}
.sheet-head{display:flex;align-items:center;gap:8px;flex:none;touch-action:none}
.sheet-word{flex:1;min-width:0;font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-ext{display:flex;gap:6px;margin:8px 0 0;flex:none}
.sheet-ext button{height:30px;padding:0 11px;border-radius:15px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--mute)}
.sheet-ext button:disabled{opacity:.35}
.sheet-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:10px 0 2px}
.sheet-body{font-size:16px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-height:52px}
.sheet-body.load,.sheet-trans.load{color:var(--mute)}
.sheet-trans{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.65;white-space:pre-wrap;color:var(--ink)}
.sheet-trans.analysis{white-space:normal;overflow-wrap:anywhere}
.sheet-trans.analysis h4{margin:14px 0 7px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;font-weight:700;letter-spacing:.04em;color:var(--mute)}
.sheet-trans.analysis h4:first-child{margin-top:0;padding-top:0;border-top:0}
.sheet-trans.analysis p{margin:5px 0;line-height:1.7;overflow-wrap:anywhere}
.sheet-trans.analysis ol,.sheet-trans.analysis ul{margin:5px 0 10px;padding-left:23px;display:grid;gap:7px}
.sheet-trans.analysis li{padding-left:2px;line-height:1.7;overflow-wrap:anywhere}
.sheet-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px;flex:none}
.sheet-actions .btn{height:40px;font-size:12.5px;padding:0 5px;border-radius:13px}
.sheet-actions .btn.done{color:#2e8b57}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-30px);opacity:0;z-index:90;background:var(--on);color:var(--onfg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;max-width:88vw;transition:all .25s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.read-progress{position:relative;z-index:9;flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) clamp(18px,4vw,32px) 4px;color:var(--mute);font-size:10px;font-variant-numeric:tabular-nums}
.read-progress .track{height:3px;flex:1;border-radius:8px;background:var(--chip);overflow:hidden}
.read-progress .fill{height:100%;width:0;border-radius:inherit;background:var(--selline);transition:width .08s linear}
.word-modal{position:fixed;z-index:72;left:50%;top:50%;width:min(560px,calc(100vw - 28px));max-height:min(78dvh,760px);display:flex;flex-direction:column;overflow:hidden;padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.28);opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.97);transition:opacity .2s,transform .22s}
.word-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.word-modal-head{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.word-modal-controls{display:flex;gap:8px;margin-top:10px}
.word-modal-controls .btn{height:36px;flex:1;font-size:12px;border-radius:12px}
.word-modal-word{margin:16px 0 8px;font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.22;overflow-wrap:anywhere}
.word-modal-context{padding:10px 12px;border-radius:12px;background:var(--chip);font-size:13px;line-height:1.55;color:var(--mute);max-height:96px;overflow:auto}
.word-modal-detail{flex:1;min-height:90px;overflow-y:auto;overscroll-behavior:contain;margin-top:14px;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.word-modal-detail.load{color:var(--mute)}
.word-modal-hint{flex:none;margin-top:10px;text-align:center;color:var(--mute);font-size:11px}
@media(min-width:700px){.article{font-size:calc(var(--font) - 2px)}}
@media(min-width:1100px){
 #app{width:100%;max-width:1680px;left:50%;right:auto;transform:translateX(-50%);box-shadow:0 0 0 1px var(--line)}
 .page{width:100%;max-width:1120px;margin:0 auto;padding-left:30px;padding-right:30px}
 #reader-scroll{padding-left:clamp(36px,5vw,84px);padding-right:clamp(36px,5vw,84px)}
 .article{max-width:940px}
 .dock{gap:12px;padding-top:10px;padding-bottom:12px}
 .sheet{max-width:680px}
 .msheet{max-width:640px}
}
@media(min-width:1600px){.page{max-width:1280px}.article{max-width:1040px}.read-progress{padding-left:clamp(60px,7vw,120px);padding-right:clamp(60px,7vw,120px)}.word-modal{width:min(620px,calc(100vw - 40px))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* =====================================================
   Liquid Glass 视觉层
   用变量统一三种主题；只改表面质感，不改布局与交互
   ===================================================== */
:root{
  --line:rgba(80,92,118,.15);--chip:rgba(255,255,255,.40);--card:rgba(255,255,255,.46);--glass:rgba(255,255,255,.58);
  --glass-fill:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.28));
  --glass-strong:linear-gradient(145deg,rgba(255,255,255,.88),rgba(249,250,255,.64));
  --nav-fill:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.42));
  --field-fill:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.40));
  --seg-on:linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,255,255,.64));
  --pri-bg:linear-gradient(145deg,#4a5260,#272d38);--pri-fg:#fff;
  --hi:rgba(255,255,255,.90);--rim:rgba(255,255,255,.60);--lo:rgba(90,104,135,.10);--sheen:rgba(255,255,255,.14);
  --sh-s:0 6px 20px rgba(42,55,82,.07);--sh-m:0 10px 30px rgba(42,55,82,.11);--sh-l:0 22px 64px rgba(35,48,75,.22);
  --orb1:rgba(132,166,236,.34);--orb2:rgba(194,166,232,.28);
  --mask:rgba(25,31,43,.28);--blur:blur(24px) saturate(185%);--blur-l:blur(36px) saturate(200%);
  --knob:#fff;--green:#34c759;
}
:root[data-theme=sepia]{
  --line:rgba(112,91,54,.17);--chip:rgba(255,251,238,.44);--card:rgba(255,250,235,.50);--glass:rgba(250,244,226,.64);
  --glass-fill:linear-gradient(145deg,rgba(255,252,240,.72),rgba(246,237,214,.34));
  --glass-strong:linear-gradient(145deg,rgba(255,252,242,.90),rgba(247,240,220,.70));
  --nav-fill:linear-gradient(145deg,rgba(255,252,240,.86),rgba(246,237,214,.58));
  --field-fill:linear-gradient(145deg,rgba(255,252,242,.74),rgba(246,237,214,.42));
  --seg-on:linear-gradient(145deg,rgba(255,253,244,.97),rgba(250,243,224,.70));
  --pri-bg:linear-gradient(145deg,#5f5441,#3a3326);--pri-fg:#f7efd9;
  --hi:rgba(255,253,244,.85);--rim:rgba(255,250,232,.60);--lo:rgba(112,91,54,.10);--sheen:rgba(255,252,238,.36);
  --sh-s:0 6px 20px rgba(84,65,31,.08);--sh-m:0 10px 30px rgba(84,65,31,.11);--sh-l:0 22px 64px rgba(84,65,31,.22);
  --orb1:rgba(232,190,120,.34);--orb2:rgba(214,160,130,.26);
  --mask:rgba(50,40,20,.28);
}
:root[data-theme=dark]{
  --line:rgba(225,230,245,.12);--chip:rgba(225,230,245,.07);--card:rgba(225,230,245,.05);--glass:rgba(34,38,46,.72);
  --glass-fill:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.05));
  --glass-strong:linear-gradient(145deg,rgba(52,57,68,.94),rgba(30,34,41,.95));
  --nav-fill:linear-gradient(145deg,rgba(58,64,77,.78),rgba(30,34,42,.74));
  --field-fill:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.04));
  --seg-on:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  --pri-bg:linear-gradient(145deg,#b6bfce,#919bad);--pri-fg:#171a20;
  --hi:rgba(255,255,255,.10);--rim:rgba(255,255,255,.08);--lo:rgba(0,0,0,.28);--sheen:rgba(255,255,255,.02);
  --sh-s:0 6px 20px rgba(0,0,0,.22);--sh-m:0 10px 30px rgba(0,0,0,.30);--sh-l:0 22px 64px rgba(0,0,0,.50);
  --orb1:rgba(80,112,180,.22);--orb2:rgba(122,96,168,.18);
  --mask:rgba(0,0,0,.50);
  --knob:#d6dae2;--green:#3b9f60;
  --read-ink:#b9bec8;
}
/* 背景光斑：给毛玻璃提供可折射的色彩 */
main{z-index:1}
/* 已移除彩色光斑：它们会透过半透明表面，看起来像底部漏光 */

/* 卡片 */
.card,.item,.stat{
  border:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.card{
  position:relative;overflow:hidden;background:var(--glass-fill);
  box-shadow:var(--sh-s),inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--rim),inset 0 -1px 0 var(--lo);
}
.card::before{content:"";position:absolute;inset:0 0 auto;height:46%;background:linear-gradient(115deg,var(--sheen),transparent 62%);pointer-events:none;z-index:0}
.card>*{position:relative;z-index:1}
.item{background:var(--glass-fill);box-shadow:var(--sh-s),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.stat{background:var(--field-fill);box-shadow:inset 0 1px 0 var(--hi)}
/* 滑动行的前景必须不透明，否则会透出底下的「分类 / 删除」 */
.swipe>.item{background:var(--glass-fill),var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
.swipe{box-shadow:var(--sh-s)}

/* 按钮 / 小控件 */
.btn,.dk,.ibtn,.chip,.cat-opt,.sheet-ext button{
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--hi),0 3px 10px rgba(45,57,80,.05);
  -webkit-backdrop-filter:blur(16px) saturate(165%);backdrop-filter:blur(16px) saturate(165%);
  transition:transform .15s,opacity .15s,background .2s;
}
.btn,.dk,.ibtn,.chip,.cat-opt,.sheet-ext button{background:var(--glass-fill)}
.btn.primary,.dk.play,.chip.on,.cat-opt.on{background:var(--pri-bg);color:var(--pri-fg);border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 7px 18px rgba(30,40,60,.20)}
:root[data-theme=dark] .btn.primary,:root[data-theme=dark] .dk.play,:root[data-theme=dark] .chip.on,:root[data-theme=dark] .cat-opt.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 6px 16px rgba(0,0,0,.32)}
.btn:active,.dk:active,.ibtn:active,.chip:active,.cat-opt:active{transform:scale(.97);opacity:.88}
.sheet-actions .btn.done{color:#2e8b57}
:root[data-theme=dark] .sheet-actions .btn.done{color:#6cc08d}
.dk.fav.on{color:#c9962b}
.tag{border:1px solid var(--line)}

/* 输入框：内凹玻璃 */
textarea,input[type=text],input[type=password],input[type=search],select{
  background:var(--field-fill);border-color:var(--line);
  box-shadow:inset 0 2px 7px rgba(45,57,80,.05),inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
}
:root[data-theme=dark] textarea,:root[data-theme=dark] input[type=text],:root[data-theme=dark] input[type=password],:root[data-theme=dark] input[type=search],:root[data-theme=dark] select{box-shadow:inset 0 2px 8px rgba(0,0,0,.20),inset 0 1px 0 var(--hi)}
textarea:focus,input:focus,select:focus{border-color:rgba(91,125,190,.55);box-shadow:0 0 0 3px rgba(91,125,190,.14),inset 0 1px 0 var(--hi)}

/* 分段控件 / 开关 */
.seg{background:rgba(120,132,155,.10);border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(35,45,65,.07),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.seg button.on{background:var(--seg-on);color:var(--ink);border:1px solid var(--rim);box-shadow:0 3px 10px rgba(44,55,78,.10),inset 0 1px 0 var(--hi)}
.switch i{background:rgba(120,132,155,.20);box-shadow:inset 0 1px 3px rgba(0,0,0,.10)}
.switch i::after{background:var(--knob);box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06)}
.switch input:checked+i{background:var(--green);border-color:var(--green)}

/* 底部导航 */
.nav{
  background:var(--nav-fill);border:1px solid var(--rim);
  box-shadow:var(--sh-m),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo);
  -webkit-backdrop-filter:blur(34px) saturate(210%);backdrop-filter:blur(34px) saturate(210%);
}
.tab.active{background:var(--seg-on);border:1px solid var(--rim);box-shadow:0 3px 12px rgba(42,55,82,.10),inset 0 1px 0 var(--hi)}

/* 弹层 */
.sheet,.msheet,.word-modal{
  background:var(--glass-strong);border-color:var(--rim);
  box-shadow:var(--sh-l),inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);
}
.grab{background:rgba(120,132,155,.35)}
.mask{background:var(--mask);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.word-modal-context{background:var(--field-fill);border:1px solid var(--line)}
.toast{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--sh-m)}

/* 滑动行：右滑露出「命名 / 分类」 */
.swipe .acts .grp{display:flex;gap:2px}
.swipe .act{width:80px}
.swipe .act.name{background:#3f9b83}
.read-progress #read-progress-text{white-space:nowrap}
.mini-progress b{white-space:nowrap;min-width:0}

/* 关闭按钮（所有弹窗统一） */
.xbtn{flex:none;width:34px;height:34px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);background:var(--glass-fill);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 3px 10px rgba(45,57,80,.08);-webkit-backdrop-filter:blur(16px) saturate(165%);backdrop-filter:blur(16px) saturate(165%);transition:transform .15s,color .15s,background .2s}
.xbtn svg{width:14px;height:14px}
.xbtn:hover{color:var(--ink)}
.xbtn:active{transform:scale(.88)}

/* 生词卡：红色单词 / 音节 / 音标 / 英文释义 / 中文释义 / 例句 */
:root{--wred:#d23f31}
:root[data-theme=sepia]{--wred:#bf3a2b}
:root[data-theme=dark]{--wred:#e3887f}
.word-modal-word{margin:10px 0 2px;font-size:34px;color:var(--wred);letter-spacing:.01em}
.word-modal-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-height:22px;margin-bottom:6px}
.wi-syl{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.wi-ipa{font-family:"Segoe UI","Noto Sans","Arial Unicode MS",var(--sans);font-size:15px;color:var(--mute)}
.word-modal-detail{white-space:normal;margin-top:8px;padding-right:2px}
.word-modal-detail.load{white-space:pre-wrap}
.wi-sec{padding:12px 0;border-top:1px solid var(--line)}
.wi-sec:first-child{border-top:0;padding-top:4px}
.wi-sec h4{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.wi-sec p{margin:0;font-size:15.5px;line-height:1.7}
.wi-pos{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:9px;background:var(--chip);border:1px solid var(--line);font-style:normal;font-size:12px;font-weight:600;color:var(--mute);vertical-align:1px}
.wi-ex{margin:0;padding:0;list-style:none;counter-reset:ex;display:grid;gap:12px}
.wi-ex li{counter-increment:ex;position:relative;padding-left:28px}
.wi-ex li::before{content:counter(ex);position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--chip);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center}
.wi-en{font-family:var(--serif);font-size:15px;line-height:1.6}
.wi-zh{margin-top:2px;font-size:13.5px;line-height:1.6;color:var(--mute)}
.wi-note{margin:10px 0 0;font-size:12px;color:var(--mute)}
.word-modal-context{flex:none;margin-top:10px;padding:8px 10px;font-size:12px;line-height:1.5;max-height:64px}

/* 不支持 backdrop-filter 时回退为实色 */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.item,.nav,.sheet,.msheet,.word-modal{background:var(--paper)}
}

/* Liquid-glass floating orb navigation & tools */
.orb-dim{position:fixed;inset:0;z-index:34;background:transparent;opacity:0;pointer-events:none;transition:opacity .18s}
.orb-dim.open{opacity:1;pointer-events:auto}
.orb-root{position:fixed;z-index:36;right:max(16px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 12px);width:62px;height:62px}
.orb-toggle{position:absolute;right:0;bottom:0;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--glass-fill);border:1px solid var(--rim);box-shadow:var(--sh-l),inset 0 1px 0 var(--hi),inset 0 -2px 5px var(--lo);-webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);transition:transform .22s,box-shadow .22s}
.orb-toggle svg{position:absolute;width:24px;height:24px;transition:opacity .18s,transform .22s}
.orb-icon-close{opacity:0;transform:rotate(-45deg) scale(.6)}
.orb-toggle:active{transform:scale(.92)}
.orb-root.open .orb-icon-open{opacity:0;transform:rotate(45deg) scale(.6)}
.orb-root.open .orb-icon-close{opacity:1;transform:none}
.orb-panel{position:absolute;right:0;bottom:74px;width:244px;padding:13px;border-radius:25px;background:var(--glass-strong);border:1px solid var(--rim);box-shadow:var(--sh-l),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);opacity:0;pointer-events:none;transform:translateY(12px) scale(.96);transform-origin:bottom right;transition:opacity .2s,transform .22s}
.orb-root.open .orb-panel{opacity:1;pointer-events:auto;transform:none}
.orb-nav-grid,.orb-reader-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.orb-action{min-width:0;width:49px;height:57px;margin:auto;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);background:var(--glass-fill);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 5px 14px rgba(45,57,80,.08);-webkit-backdrop-filter:blur(14px) saturate(165%);backdrop-filter:blur(14px) saturate(165%);transition:transform .16s,background .16s,color .16s}
.orb-action svg{width:19px;height:19px;flex:none}
.orb-action span{font-size:10px;line-height:1.1;font-weight:650;white-space:nowrap}
.orb-action b{font-size:16px;line-height:19px}
.orb-action.active{color:var(--ink);background:var(--seg-on);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--selline),0 6px 18px rgba(45,57,80,.12)}
.orb-action:active{transform:scale(.92)}
.orb-divider{height:1px;background:var(--line);margin:11px 2px}
.orb-reader-actions[hidden]{display:none}
.orb-reader-actions .orb-action{height:55px}
.orb-reader-actions #btn-favorite.on{color:#c9962b}
@media(max-width:380px){.orb-panel{width:226px;padding:11px}.orb-action{width:44px;height:53px}}
/* 全站操作按钮统一为悬浮玻璃胶囊；阅读页不再保留固定底栏 */
.btn{border:1px solid var(--rim);background:var(--glass-fill);box-shadow:inset 0 1px 0 var(--hi),0 5px 14px rgba(45,57,80,.08);-webkit-backdrop-filter:blur(14px) saturate(165%);backdrop-filter:blur(14px) saturate(165%);border-radius:999px}
.btn.primary{background:var(--pri-bg);color:var(--pri-fg);border-color:transparent;box-shadow:0 7px 18px rgba(42,55,82,.18),inset 0 1px 0 rgba(255,255,255,.15)}
.ibtn{border:1px solid var(--line);background:var(--glass-fill);box-shadow:var(--sh-s),inset 0 1px 0 var(--hi)}
.seg button,.sheet-ext button,.cat-opt{border-radius:999px;box-shadow:inset 0 1px 0 var(--hi),0 4px 12px rgba(45,57,80,.06)}
#reader-scroll{padding-bottom:24px}
</style>
</head>
<body>
<div id="app">
<div class="topfade"></div>
<main>
 <!-- 粘贴 -->
 <section class="panel active" id="panel-paste"><div class="page">
  <div class="card" id="resume-card" hidden>
   <h2>继续阅读</h2>
   <div class="hint" id="resume-snip" style="margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden"></div>
   <button class="btn primary" id="btn-resume" style="width:100%">回到上次位置</button>
  </div>
  <div class="card">
   <h2>粘贴内容</h2>
   <textarea id="raw-input" maxlength="120000" placeholder="粘贴英文文章、网页正文或学习材料……" spellcheck="false" autocapitalize="off"></textarea>
   <div class="foot"><span id="word-count">0 words</span><span id="input-count">0 / 120,000</span></div>
   <div class="row"><button class="btn primary block" id="btn-read-direct">直接阅读</button><button class="btn block" id="btn-clean">AI 整理后阅读</button></div>
   <div class="row" style="margin-top:8px"><button class="btn block" id="btn-paste">粘贴剪贴板</button><button class="btn block" id="btn-clear">清空</button></div>
   <div class="status" id="paste-status" role="status" aria-live="polite"></div>
  </div>
 </div></section>

 <!-- 阅读 -->
 <section class="panel" id="panel-read">
  <div class="read-progress"><span id="read-progress-text">0%</span><span class="track"><i class="fill" id="read-progress-fill"></i></span></div>
  <div id="reader-scroll"><article class="article focus-on" id="article-body" lang="en"></article></div>
 </section>

 <!-- 收藏 -->
 <section class="panel" id="panel-saved"><div class="page">
  <div class="seg" id="saved-seg" style="margin-bottom:14px"><button class="on" data-v="articles">文章 <span id="saved-count">0</span></button><button data-v="words">生词 <span id="word-num">0</span></button></div>
  <div id="view-articles">
   <div class="chips" id="cat-chips" hidden></div>
   <div class="swipe-hint" id="swipe-hint" hidden>← 左滑删除　右滑命名 / 分类 →</div>
   <div class="list" id="saved-list"></div>
  </div>
  <div id="view-words" hidden>
   <div class="row" style="margin-bottom:10px;justify-content:flex-end"><button class="btn sm primary" id="btn-bulk">批量添加</button><button class="btn sm" id="btn-copy-words">复制全部</button></div>
   <div class="list" id="word-list"></div>
  </div>
 </div></section>

 <!-- 设置 -->
 <section class="panel" id="panel-settings"><div class="page">
  <div class="card">
   <h2>外观</h2>
   <div class="seg" id="theme-seg"><button data-t="auto">自动</button><button data-t="light">白</button><button data-t="sepia">护眼</button><button data-t="dark">夜间</button></div>
   <div class="field" style="margin-top:14px"><label>字号 <span id="font-val"></span></label><input type="range" id="font-range" min="16" max="40" step="1"></div>
   <div class="field"><label>行间距 <span id="line-val"></span></label><input type="range" id="line-range" min="1.3" max="2.4" step="0.05"></div>
   <div class="field"><label>段间距 <span id="para-val"></span></label><input type="range" id="para-range" min="0.1" max="1.8" step="0.05"></div>
   <div class="field"><label>对齐方式</label><div class="seg" id="align-seg"><button data-align="left">左对齐</button><button data-align="justify">两端对齐</button><button data-align="center">居中</button></div></div>
   <div class="switch-row"><div><b>专注高亮</b><div class="hint">滚动时高亮当前句，淡化其余</div></div><label class="switch"><input type="checkbox" id="focus-sw"><i></i></label></div>
  </div>
  <div class="card">
   <h2>AI 设置（整理网页 / 中文释义 / 翻译）</h2>
   <div class="field"><label for="api-key">DeepSeek API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="sk-…"></div>
   <div class="field"><label for="base-url">接口地址</label><input id="base-url" type="text" inputmode="url" autocapitalize="off"></div>
   <div class="field"><label for="model">模型</label><input id="model" type="text" list="model-list" autocapitalize="off"><datalist id="model-list"><option value="deepseek-chat"><option value="deepseek-reasoner"><option value="deepseek-flash"><option value="deepseek-v4-pro"></datalist></div>
   <div class="row"><button class="btn primary" id="btn-save">保存</button><span class="hint" id="save-status"></span></div>
   <p class="hint" style="margin:10px 0 0">Key 仅保存在本机浏览器。未填写时，查词会使用免费英文词典（仅单词）。</p>
  </div>
  <div class="card">
   <h2>Token 统计</h2>
   <div class="stats"><div class="stat"><b id="stat-calls">0</b><span>调用</span></div><div class="stat"><b id="stat-prompt">0</b><span>输入</span></div><div class="stat"><b id="stat-completion">0</b><span>输出</span></div><div class="stat"><b id="stat-total">0</b><span>总计</span></div></div>
   <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn sm" id="btn-reset">重置</button></div>
  </div>
 </div></section>
</main>

<div class="orb-dim" id="orb-dim" aria-hidden="true"></div>
<div class="orb-root" id="orb-root">
 <div class="orb-panel" id="orb-panel" aria-hidden="true">
  <div class="orb-nav-grid" aria-label="页面切换">
   <button class="orb-action active" data-orb-tab="paste" aria-label="上传" title="上传">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M5 15v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg><span>上传</span>
   </button>
   <button class="orb-action" data-orb-tab="read" aria-label="阅读" title="阅读">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/></svg><span>阅读</span>
   </button>
   <button class="orb-action" data-orb-tab="saved" aria-label="收藏" title="收藏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg><span>收藏</span>
   </button>
   <button class="orb-action" data-orb-tab="settings" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>设置</span>
   </button>
  </div>
  <div class="orb-divider" id="orb-divider" hidden></div>
  <div class="orb-reader-actions" id="orb-reader-actions" hidden>
   <button class="orb-action" id="btn-favorite" aria-label="收藏文章" title="收藏文章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.8-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg><span>收藏</span></button>
   <button class="orb-action" id="btn-font-dec" aria-label="减小字号" title="减小字号"><b>A−</b><span>缩小</span></button>
   <button class="orb-action" id="btn-font-inc" aria-label="增大字号" title="增大字号"><b>A+</b><span>放大</span></button>
   <button class="orb-action" id="btn-copy-article" aria-label="复制正文" title="复制正文"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H6a2 2 0 0 0-2 2v10a1 1 0 0 0 1 1h1"/></svg><span>复制</span></button>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const KEY='manageplan_read_v1';
const D={api:'',base:'https://api.deepseek.com',model:'deepseek-chat',input:'',article:'',font:26,line:1.78,para:.55,align:'left',theme:'auto',focus:true,pos:0,posId:'',positions:{},favorites:[],words:[],stats:{calls:0,prompt:0,completion:0,total:0}};
function load(){let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}return Object.assign({},D,o,{positions:Object.assign({},D.positions,o.positions||{}),stats:Object.assign({},D.stats,o.stats||{})})}
const S=load();
S.favorites=Array.isArray(S.favorites)?S.favorites:[];
S.words=(Array.isArray(S.words)?S.words:[]).map(w=>typeof w==='string'?{w:w,m:'',c:'',t:Date.now()}:w).filter(w=>w&&w.w);S.positions=S.positions&&typeof S.positions==='object'?S.positions:{};
S.font=Math.min(40,Math.max(16,Number(S.font)||26));S.line=Math.min(2.4,Math.max(1.3,Number(S.line)||1.78));S.para=Math.min(1.8,Math.max(.1,Number(S.para)||.55));S.align=['left','justify','center'].includes(S.align)?S.align:'left';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let toastT=0;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1900)}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'a'+(h>>>0).toString(36)+s.length}
const ICON={
 star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.500l2.600 5.400 5.900.8-4.300 4.100 1.100 5.900L12 16.900 6.700 19.700l1.100-5.900L3.500 9.700l5.900-.8z"/></svg>',
 starOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3.500l2.600 5.400 5.900.8-4.300 4.100 1.100 5.900L12 16.900 6.700 19.700l1.100-5.900L3.500 9.700l5.900-.8z"/></svg>'
};

/* ---------- 主题 / 状态栏颜色 ---------- */
const PAPER={light:'#f6f5f1',sepia:'#f1e8d2',dark:'#17191e'};
const mq=window.matchMedia?matchMedia('(prefers-color-scheme:dark)'):null;
function applyTheme(){
 let t=S.theme;if(t==='auto')t=mq&&mq.matches?'dark':'light';
 document.documentElement.dataset.theme=t;
 $('meta[name=theme-color]').setAttribute('content',PAPER[t]||PAPER.light);
 $$('#theme-seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme));
}
if(mq){const f=()=>{if(S.theme==='auto')applyTheme()};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f)}
function applyFont(){document.documentElement.style.setProperty('--font',S.font+'px');$('#font-val').textContent=S.font+'px';$('#font-range').value=S.font;}
function applyTypography(){const root=document.documentElement;root.style.setProperty('--line-height',String(S.line));root.style.setProperty('--para-gap',S.para+'em');root.style.setProperty('--read-align',S.align);$('#line-val').textContent=S.line.toFixed(2)+'×';$('#line-range').value=S.line;$('#para-val').textContent=S.para.toFixed(2)+'em';$('#para-range').value=S.para;document.querySelectorAll('#align-seg button').forEach(b=>b.classList.toggle('on',b.dataset.align===S.align));requestAnimationFrame(updateFocus);}

/* ---------- 标签页 ---------- */
function tab(n){
 if(n!=='read'&&$('#panel-read').classList.contains('active')){persistReadingProgress();clearTimeout(posT)}
 document.querySelectorAll('.orb-action[data-orb-tab]').forEach(b=>b.classList.toggle('active',b.dataset.orbTab===n));
 $('#orb-reader-actions').hidden=n!=='read';
 $('#orb-divider').hidden=n!=='read';
 $('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+n));
 if(n!=='read')closeSheet();
 closeModal();
 if(n==='saved')renderSaved();
 if(n==='paste')updateResume();
 if(n==='read')requestAnimationFrame(updateFocus);
 closeOrbMenu();
}
function setOrbMenu(open){
 const root=$('#orb-root'),panel=$('#orb-panel'),dim=$('#orb-dim'),toggle=$('#orb-toggle');
 root.classList.toggle('open',!!open);dim.classList.toggle('open',!!open);
 panel.setAttribute('aria-hidden',String(!open));toggle.setAttribute('aria-expanded',String(!!open));
 toggle.setAttribute('aria-label',open?'关闭悬浮菜单':'打开悬浮菜单');
}
function closeOrbMenu(){setOrbMenu(false)}
$('#orb-toggle').addEventListener('click',()=>setOrbMenu(!$('#orb-root').classList.contains('open')));
$('#orb-dim').addEventListener('click',closeOrbMenu);
$('.orb-action[data-orb-tab]').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.orbTab)));
$('#orb-reader-actions').addEventListener('click',e=>{if(e.target.closest('button'))closeOrbMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOrbMenu()});
document.addEventListener('click',e=>{const g=e.target.closest('[data-goto]');if(g)tab(g.dataset.goto)});

/* ---------- 文本切分 ---------- */
function splitParagraphs(t){
 const raw=String(t||'').replace(/\r\n?/g,'\n').replace(/[\u2028\u2029]/g,'\n').trim();if(!raw)return [];
 return raw.split(/\n[\t ]*\n+/).map(block=>block.split(/\n+/).map(x=>x.replace(/[\t ]+/g,' ').trim()).filter(Boolean).join(' ')).filter(Boolean);
}
function sentences(p){
 const src=String(p||'').replace(/\s+/g,' ').trim();
 if(!src)return [];
 const out=[];let start=0;
 const terminal=/[.!?。！？…؟۔｡።]/;
 const closing=/["'’”»）)\]}】』」〕〉》]/;
 const attribution=/^\s+(?:(?:he|she|they|i|we|you)\b|[A-Z][A-Za-z'’-]*(?:\s+[A-Z][A-Za-z'’-]*){0,2})\s+(?:said|asked|answered|replied|whispered|shouted|murmured|added|continued|cried|exclaimed|remarked|announced|noted|wrote|called|demanded|suggested|observed)\b/i;
 const cjkAttribution=/^(?:\s*)(?:他|她|他们|她们|老师|总统|记者|医生|父亲|母亲|男孩|女孩)(?:说道|说|问道|问|回答|答道|补充说|解释道|喊道|叫道|表示|回应)/;
 const titles=/(?:^|\s)(?:Mr|Mrs|Ms|Mx|Dr|Prof|Professor|Rev|Fr|Sr|Jr|St|Mt|Ft|Capt|Col|Gen|Lt|Maj|Gov|Sen|Rep|Amb|Sgt|Adm|Cmdr)\.$/i;
 const abbreviations=/(?:^|\s)(?:e\.g|i\.e|u\.s\.a|u\.s|u\.k|u\.n|e\.u|ph\.d|m\.d|a\.m|p\.m|vs|etc|no|fig|inc|ltd|co|corp|dept|univ|mt|ft|ave|blvd|rd|st|jr|sr)\.$/i;
 function ignorePeriod(i){
  const before=src.slice(start,i+1),after=src.slice(i+1);
  if(/\d/.test(src[i-1]||'')&&/\d/.test(src[i+1]||''))return true;
  if(/(?:^|\s)[ei]\.$/i.test(before)&&/^[gG]\./.test(after))return true;
  if(titles.test(before)&&after.trim())return true;
  if(/(?:^|\s)[A-Z]\.$/.test(before)&&/^\s*[A-Z]/.test(after))return true;
  if(/(?:^|\s)(?:[A-Z]\.)+[A-Z]\.$/.test(before)&&/^[A-Z]\./.test(after))return true;
  if(/(?:^|\s)(?:no|fig)\.$/i.test(before)&&/^\s*\d/.test(after))return true;
  if(abbreviations.test(before)&&/^\s*[a-z]/.test(after))return true;
  return false;
 }
 for(let i=0;i<src.length;i++){
  const ch=src[i];if(!terminal.test(ch))continue;
  if(ch==='.'&&ignorePeriod(i))continue;
  let j=i+1;
  while(j<src.length&&terminal.test(src[j]))j++;
  while(j<src.length&&closing.test(src[j]))j++;
  // 引号后的 said/asked 等转述语仍属于同一句，不把转述语拆成残句
  if(j>i+1&&(attribution.test(src.slice(j))||cjkAttribution.test(src.slice(j))))continue;
  const part=src.slice(start,j).trim();
  if(part)out.push(part);
  while(j<src.length&&/\s/.test(src[j]))j++;
  start=j;i=j-1;
 }
 const rest=src.slice(start).trim();if(rest)out.push(rest);
 return out;
}
function wordCount(t){return (String(t||'').match(/[A-Za-z]+(?:['’-][A-Za-z]+)*|[\u3400-\u9fff]+/g)||[]).length}
function wrapHtml(s){
 let h='',last=0,m;const re=/[A-Za-z]+(?:['’-][A-Za-z]+)*|[\u3400-\u9fff]+/g;
 while((m=re.exec(s))){h+=esc(s.slice(last,m.index))+'<span class="w" data-s="'+m.index+'" data-e="'+(m.index+m[0].length)+'">'+esc(m[0])+'</span>';last=m.index+m[0].length}
 return h+esc(s.slice(last));
}

/* ---------- 渲染文章 ---------- */
let current={id:'',content:S.article||''},SENTS=[],WORDS=[],focusI=0;
const bodyEl=$('#article-body'),scrollEl=$('#reader-scroll');
function render(t){
 SENTS=[];WORDS=[];focusI=0;
 const ps=splitParagraphs(t);
 if(!ps.length){bodyEl.innerHTML='<div class="empty">还没有文章<br>先到「上传」页添加英文内容<br><button class="btn primary" data-goto="paste">去粘贴</button></div>';return}
 const frag=document.createDocumentFragment();
 ps.forEach((p,pi)=>{
  sentences(p).forEach(s=>{
   const pe=document.createElement('p');pe.className='para';
   const se=document.createElement('span');se.className='sent';se.dataset.i=SENTS.length;se.innerHTML=wrapHtml(s);
   SENTS.push({el:se,text:s,paragraph:pi,paragraphText:p});pe.appendChild(se);frag.appendChild(pe);
  });
 });
 bodyEl.innerHTML='';bodyEl.appendChild(frag);
 WORDS=Array.from(bodyEl.querySelectorAll('.w'));WORDS.forEach((e,i)=>{e.dataset.k=i});
 
}
function progressFor(id){const v=S.positions&&S.positions[id];if(v===undefined){const f=S.favorites.find(x=>x.id===id);if(f&&Number.isFinite(f.progress))return Math.max(0,Math.min(1,f.progress))}if(typeof v==='number'&&Number.isFinite(v))return Math.max(0,Math.min(1,v));if(v&&typeof v.ratio==='number'&&Number.isFinite(v.ratio))return Math.max(0,Math.min(1,v.ratio));return id===S.posId?Math.max(0,Math.min(1,Number(S.pos)||0)):0;}
function updateReadProgress(value){const max=Math.max(0,scrollEl.scrollHeight-scrollEl.clientHeight),ratio=value===undefined?(max>0?scrollEl.scrollTop/max:(SENTS.length?1:0)):value,p=Math.max(0,Math.min(1,ratio));$('#read-progress-fill').style.width=(p*100)+'%';$('#read-progress-text').textContent=readLabel(p);}
/* 正文顶部进度：百分比 · 第几句/总句数 · 预计剩余时间 */
function readLabel(p){
 if(!SENTS.length)return '0%';
 const live=scrollEl.clientHeight&&$('#panel-read').classList.contains('active');
 const n=live?anchorIndex()+1:Math.max(1,Math.round(p*SENTS.length));
 const wc=current.wc||(current.wc=wordCount(current.content));
 return Math.round(p*100)+'% · '+n+'/'+SENTS.length+' 句 · '+(p>=.995?'已读完':'约 '+Math.max(1,Math.ceil(wc*(1-p)/200))+' 分钟');
}
/* 当前视口焦点线上的句子（与专注高亮同一基准，且不依赖专注开关） */
const FOCUS_Y=r=>r.top+Math.min(r.height*.38,250);
function anchorIndex(){
 if(!SENTS.length)return 0;
 const max=Math.max(0,scrollEl.scrollHeight-scrollEl.clientHeight);
 if(scrollEl.scrollTop<=2)return 0;
 if(max>2&&scrollEl.scrollTop>=max-2)return SENTS.length-1;
 const y=FOCUS_Y(scrollEl.getBoundingClientRect());
 let lo=0,hi=SENTS.length;
 while(lo<hi){const mid=(lo+hi)>>1;if(SENTS[mid].el.getBoundingClientRect().bottom<y)lo=mid+1;else hi=mid}
 let best=Math.min(lo,SENTS.length-1),dist=Infinity;
 for(let k=Math.max(0,lo-2);k<=Math.min(SENTS.length-1,lo+2);k++){const rs=SENTS[k].el.getClientRects();let d=Infinity;for(let q=0;q<rs.length;q++){const b=rs[q],dd=y<b.top?b.top-y:y>b.bottom?y-b.bottom:0;if(dd<d)d=dd}if(d<dist){dist=d;best=k}}
 return best;
}
/* 阅读面板不可见时（切到其他标签 / 退到后台）布局高度为 0，绝不能写入进度，否则会被覆盖成 100% */
function persistReadingProgress(){if(!current.id||!SENTS.length||!$('#panel-read').classList.contains('active')||!scrollEl.clientHeight)return;const max=Math.max(0,scrollEl.scrollHeight-scrollEl.clientHeight),ratio=max>0?scrollEl.scrollTop/max:(SENTS.length?1:0) ,anchor=anchorIndex();S.positions[current.id]={ratio:Math.max(0,Math.min(1,ratio)),sentence:anchor,updatedAt:Date.now()};S.pos=S.positions[current.id].ratio;S.posId=current.id;const fav=S.favorites.find(x=>x.id===current.id);if(fav)fav.progress=S.pos;save();updateReadProgress(S.pos);}
function restoreReadPosition(id,fallback){const saved=S.positions&&S.positions[id],si=saved&&Number.isInteger(saved.sentence)?saved.sentence:-1;if(si>=0&&SENTS[si]){const sc=scrollEl.getBoundingClientRect(),r=SENTS[si].el.getBoundingClientRect(),target=FOCUS_Y(sc)-6;scrollEl.scrollTop+=r.top-target;}else scrollEl.scrollTop=Math.max(0,Math.min(1,fallback||0))*Math.max(0,scrollEl.scrollHeight-scrollEl.clientHeight);updateFocus();updateReadProgress();persistReadingProgress();}
function openArticle(t){closeSheet();const id=hash(t),resume=progressFor(id);current={id:id,content:t};S.article=t;S.pos=resume;S.posId=id;save();render(t);updateFavBtn();tab('read');requestAnimationFrame(()=>restoreReadPosition(id,resume));}

/* ---------- 专注高亮：从首句跟随到末句 ---------- */
let focusRaf=0,posT=0,readProgressRaf=0;
function updateFocus(){focusRaf=0;if(!$('#panel-read').classList.contains('active'))return;const old=bodyEl.querySelector('.is-focused');if(!S.focus||!SENTS.length){if(old)old.classList.remove('is-focused');bodyEl.classList.remove('has-focus');return}const maxScroll=Math.max(0,scrollEl.scrollHeight-scrollEl.clientHeight);let index=0;if(scrollEl.scrollTop<=2)index=0;else if(maxScroll>2&&scrollEl.scrollTop>=maxScroll-2)index=SENTS.length-1;else{const r=scrollEl.getBoundingClientRect(),targetY=r.top+Math.min(r.height*.38,250);let lo=0,hi=SENTS.length;while(lo<hi){const mid=(lo+hi)>>1,box=SENTS[mid].el.getBoundingClientRect();if(box.bottom<targetY)lo=mid+1;else hi=mid}let dist=Infinity;for(let k=Math.max(0,lo-2);k<=Math.min(SENTS.length-1,lo+2);k++){/* 句子可能跨多行，用逐行矩形计算距离，避免相邻句外接框重叠导致选错 */const rs=SENTS[k].el.getClientRects();let d=Infinity;for(let q=0;q<rs.length;q++){const b=rs[q],dd=targetY<b.top?b.top-targetY:targetY>b.bottom?targetY-b.bottom:0;if(dd<d)d=dd}if(d<dist){dist=d;index=k}}}const best=SENTS[index]&&SENTS[index].el;if(best!==old){if(old)old.classList.remove('is-focused');if(best){best.classList.add('is-focused');focusI=index}}bodyEl.classList.toggle('has-focus',!!best);}
scrollEl.addEventListener('scroll',()=>{if(!focusRaf)focusRaf=requestAnimationFrame(updateFocus);if(!readProgressRaf)readProgressRaf=requestAnimationFrame(()=>{readProgressRaf=0;updateReadProgress()});clearTimeout(posT);posT=setTimeout(persistReadingProgress,220)},{passive:true});
scrollEl.addEventListener('scrollend',()=>{clearTimeout(posT);persistReadingProgress();updateFocus()},{passive:true});

/* ---------- AI ---------- */
function apiBase(){let u;try{u=new URL(String(S.base).replace(/\/+$/,''))}catch(e){throw Error('接口地址格式不正确')}if(!/^https?:$/.test(u.protocol))throw Error('接口地址只支持 HTTP/HTTPS');return u.href.replace(/\/+$/,'')}
async function ai(messages,opt){
 opt=opt||{};
 if(!S.api)throw Error('请先到「设置」填写 API Key');
 const body={model:S.model,messages:messages,temperature:opt.temperature!==undefined?opt.temperature:.15,max_tokens:opt.maxTokens||4096};
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),opt.timeout||90000);
 try{
  const res=await fetch(apiBase()+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.api},body:JSON.stringify(body),signal:ctl.signal});
  const raw=await res.text();let d;try{d=JSON.parse(raw)}catch(e){}
  if(!res.ok)throw Error('API '+res.status+'：'+((d&&d.error&&d.error.message)||raw.slice(0,140)));
  const choice=d&&d.choices&&d.choices[0],c=choice&&choice.message&&choice.message.content;
  if(d&&d.usage){S.stats.calls++;S.stats.prompt+=Number(d.usage.prompt_tokens)||0;S.stats.completion+=Number(d.usage.completion_tokens)||0;S.stats.total+=Number(d.usage.total_tokens)||0;save();renderStats()}
  if(typeof c!=='string'||!c.trim()){
   /* 推理类模型会把 max_tokens 先花在"思考"上，正文为空且 finish_reason=length：自动放大额度重试一次 */
   if(choice&&choice.finish_reason==='length'&&!opt._retried&&(opt.maxTokens||4096)<8192)
    return ai(messages,Object.assign({},opt,{maxTokens:Math.min(8192,(opt.maxTokens||4096)*4),timeout:(opt.timeout||90000)*1.5,_retried:1}));
   throw Error('模型没有返回内容'+(choice&&choice.finish_reason?'（'+choice.finish_reason+'）':'')+'。若使用推理模型（如 deepseek-reasoner），请在设置中改用 deepseek-chat');
  }
  return c.trim();
 }catch(e){
  if(e.name==='AbortError')throw Error('请求超时');
  if(e instanceof TypeError)throw Error('网络请求失败，请检查网络或接口跨域设置');
  throw e;
 }finally{clearTimeout(timer)}

const REVEAL=84,REVEAL_R=164;
function closeRow(){if(openRow){openRow.item.style.transform='';openRow.row.dataset.off=0;openRow=null}}
function attachSwipe(row,item,onTap){
 let x0=0,y0=0,base=0,drag=false,pid=null,off=0;
 item.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  x0=e.clientX;y0=e.clientY;base=+row.dataset.off||0;drag=false;pid=e.pointerId;off=base;
  if(openRow&&openRow.row!==row)closeRow();
 });
 item.addEventListener('pointermove',e=>{
  if(pid!==e.pointerId)return;
  const dx=e.clientX-x0,dy=e.clientY-y0;
  if(!drag){
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){drag=true;try{item.setPointerCapture(pid)}catch(_){}item.style.transition='none'}
   else return;
  }
  off=Math.max(-REVEAL,Math.min(REVEAL_R,base+dx));
  item.style.transform='translateX('+off+'px)';
 });
 const finish=cancel=>{
  if(pid===null)return;pid=null;item.style.transition='';
  if(drag){
   const to=off>REVEAL_R*.4?REVEAL_R:off<-REVEAL*.45?-REVEAL:0;
   item.style.transform=to?'translateX('+to+'px)':'';row.dataset.off=to;
   if(to){openRow={row:row,item:item}}else if(openRow&&openRow.row===row)openRow=null;
  }else if(!cancel){
   if(base!==0)closeRow();else onTap();
  }
  drag=false;
 };
 item.addEventListener('pointerup',()=>finish(false));
 item.addEventListener('pointercancel',()=>finish(true));
}

function parseWordInfo(t){

 return {syllables:str(o.syllables),phonetic:str(o.phonetic),pos:str(o.pos),en:str(o.en),zh:str(o.zh),

 $('#sheet-word').textContent=phrase();
 const sameS=k=>WORDS[k]&&WORDS[k].closest('.sent')===SENTS[sel.si].el;
 $('#sh-prev').disabled=!sameS(sel.a-1);$('#sh-next').disabled=!sameS(sel.b+1);
 updateAddBtn();
}
function openSheet(){
 sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');
 requestAnimationFrame(adjustForSheet);
}
function adjustForSheet(){
 const h=sheet.offsetHeight;
 scrollEl.style.paddingBottom=(h+40)+'px';
 if(sel.a<0)return;
 const w=WORDS[sel.a].getBoundingClientRect(),limit=sheet.getBoundingClientRect().top-18;
 if(w.bottom>limit)scrollEl.scrollBy({top:w.bottom-limit+10,behavior:'smooth'});
}
function closeSheet(){
 sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');
 $$('.w.sel').forEach(e=>e.classList.remove('sel'));sel={a:-1,b:-1,si:-1};lkTok++;transTok++;
 scrollEl.style.paddingBottom='';
}
$('#sh-close').addEventListener('click',closeSheet);
/* 分析 / 翻译结果出现在面板下方，需滚到可见处，否则看起来像"没有结果" */
function revealTrans(){requestAnimationFrame(()=>{adjustForSheet();const box=$('.sheet-scroll'),el=$('#sheet-trans');if(!box||el.hidden)return;const a=box.getBoundingClientRect(),b=el.getBoundingClientRect();box.scrollTo({top:box.scrollTop+b.top-a.top-4,behavior:'smooth'})})}
/* 快捷收起：点横条 / 点单词标题 / 在横条或标题栏下滑 / 点正文空白处 */
$('#sheet .grab').addEventListener('click',closeSheet);
$('#sheet-word').addEventListener('click',closeSheet);
[$('#sheet .grab'),$('#sheet .sheet-head')].forEach(h=>{let y0=null;h.addEventListener('pointerdown',e=>{y0=e.clientY});h.addEventListener('pointerup',e=>{if(y0!==null&&e.clientY-y0>36)closeSheet();y0=null});h.addEventListener('pointercancel',()=>{y0=null})});
scrollEl.addEventListener('click',e=>{if(!sheet.classList.contains('open'))return;if(e.target.closest&&e.target.closest('.w'))return;closeSheet()});
bodyEl.addEventListener('click',e=>{
 const w=e.target.closest&&e.target.closest('.w');
 if(!w){if(sheet.classList.contains('open'))closeSheet();return}
 const k=+w.dataset.k,se=w.closest('.sent');
 sel={a:k,b:k,si:+se.dataset.i};
 $('#sheet-trans').hidden=true;$('#sheet-trans').textContent='';
 paintSel();openSheet();scheduleLookup(0);
});
function extend(dir){
 if(sel.a<0)return;
 const se=SENTS[sel.si].el;
 if(dir<0&&WORDS[sel.a-1]&&WORDS[sel.a-1].closest('.sent')===se)sel.a--;
 else if(dir>0&&WORDS[sel.b+1]&&WORDS[sel.b+1].closest('.sent')===se)sel.b++;
 else return;
 paintSel();scheduleLookup(350);
}
$('#sh-prev').addEventListener('click',()=>extend(-1));
$('#sh-next').addEventListener('click',()=>extend(1));
function scheduleLookup(ms){clearTimeout(lkTimer);lkTimer=setTimeout(doLookup,ms)}
async function freeDict(w){
 const r=await fetch('https://api.dictionaryapi.dev/v2/entries/en/'+encodeURIComponent(w.toLowerCase()));
 if(!r.ok)throw Error('免费词典里没有这个词');
 const d=await r.json(),e=d&&d[0];if(!e)throw Error('没有查到释义');
 const ph=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
 const lines=['【国际音标】 '+(ph||'暂无可靠音标')];
 (e.meanings||[]).slice(0,3).forEach(m=>{const df=m.definitions&&m.definitions[0];if(df)lines.push(m.partOfSpeech+'. '+df.definition)});
 return lines.join('\n');
}
async function doLookup(){
 const q=phrase();if(!q)return;
 const ctx=SENTS[sel.si]?SENTS[sel.si].text:'';
 const my=++lkTok,body=$('#sheet-body');
 const ck='collins-context-v3-ipa|'+(S.api?'ai|':'free|')+q.toLowerCase()+'|'+ctx;
 if(cache.has(ck)){body.className='sheet-body';body.textContent=cache.get(ck);updateAddBtn();requestAnimationFrame(adjustForSheet);return}
 body.className='sheet-body load';body.textContent='正在查询…';
 try{
  let out;
  if(S.api){
   out=await ai([
    {role:'system',content:'你是专业英汉学习词典与专有名词识别助手。结合完整原文语境判断选中词或短语的准确含义。必须给出标准国际音标 IPA（使用斜线，如 /ˈ.../；按语境选用常见美式读音，专名只有在读音可靠时才标注，不确定则写“暂无可靠音标”，严禁猜测）。同时识别选中内容是否属于人名、地名或人名头衔/title；如是人名，尽量给出完整姓名，并将尊称/职位头衔与姓名本体区分；如是地名，注明地理实体类型。只输出以下独立栏目：【文中含义】、【国际音标】、【词性】、【English definition】、【中文释义】、【专名识别】。最多列两个常见义项；严禁例句、寒暄或冗余内容。若选中中文，给出自然英文对应词及双语释义。'},
    {role:'user',content:'选中的词语：'+q+'\n原文语境：'+(ctx||'未提供')}
   ],{temperature:0,maxTokens:420,timeout:30000});
  }else{
   if(/\s/.test(q)||/[\u3400-\u9fff]/.test(q))throw Error('词组/中文查询需要在「设置」中填写 API Key');
   out=await freeDict(q)+'\n\n（填写 API Key 后可获得结合语境的中文释义）';
  }
  cache.set(ck,out);
  if(my!==lkTok)return;
  body.className='sheet-body';body.textContent=out;
 }catch(e){
  if(my!==lkTok)return;
  body.className='sheet-body';body.textContent=e.message||'查询失败';
 }
 updateAddBtn();requestAnimationFrame(adjustForSheet);
}
function updateAddBtn(){
 const q=phrase().toLowerCase(),has=!!q&&S.words.some(w=>w.w.toLowerCase()===q),b=$('#sh-add');
 b.textContent=has?'已在生词本':'加入生词';b.classList.toggle('done',has);
}
$('#sh-add').addEventListener('click',()=>{
 const q=phrase();if(!q)return;
 const i=S.words.findIndex(w=>w.w.toLowerCase()===q.toLowerCase());
 if(i>=0){S.words.splice(i,1);toast('已移出生词本')}
 else{
  const b=$('#sheet-body'),m=b.classList.contains('load')?'':b.textContent.split('\n').slice(0,3).join('\n').slice(0,160);
  S.words.unshift({w:q,m:m,c:SENTS[sel.si]?SENTS[sel.si].text:'',t:Date.now()});toast('已加入生词本');
 }
 save();updateAddBtn();
});
function renderAnalysis(el,raw){
 const lines=String(raw||'').replace(/\r/g,'').split('\n');
 let html='',listType='';
 const closeList=()=>{if(listType){html+=listType==='ol'?'</ol>':'</ul>';listType=''}};
 lines.forEach(line=>{
  const t=line.trim().replace(/^\*\*(.*?)\*\*$/,'$1');if(!t){closeList();return}
  const heading=t.match(/^【(.+?)】\s*(.*)$/)||t.match(/^#{1,3}\s+(.+)$/);
  if(heading){closeList();html+='<h4>'+esc(heading[1])+'</h4>';if(heading[2])html+='<p>'+esc(heading[2])+'</p>';return}
  const item=t.match(/^(?:(\d+)[.)、]|[-*•])\s*(.+)$/);
  if(item){
   const nextType=item[1]?'ol':'ul';
   if(listType!==nextType){closeList();listType=nextType;html+=nextType==='ol'?'<ol>':'<ul>'}
   html+='<li>'+esc(item[2])+'</li>';return;
  }
  closeList();html+='<p>'+esc(t)+'</p>';
 });
 closeList();el.innerHTML=html||'<p>没有可显示的分析内容</p>';
}
async function explainSelection(level){
 const item=SENTS[sel.si];if(!item)return;
 const target=level==='paragraph'?(item.paragraphText||item.text):item.text;
 const el=$('#sheet-trans'),my=++transTok;
 el.hidden=false;el.className='sheet-trans load';
 el.textContent='AI 正在分析'+(level==='paragraph'?'本段':'本句')+'…';revealTrans();
 const instruction=[
  '你是一位严谨的英语精读教师，同时具备人名、地名与头衔的实体识别能力。',
  '请完整解析用户给出的英文'+(level==='paragraph'?'段落':'句子')+'，不得跳句，不得改写或遗漏原文。',
  '严格按原文顺序输出。每一句都分别使用以下栏目，栏目之间清楚分隔：',
  '【第 N 句｜原文】完整照录该句，保留原有拼写和标点。',
  '【句意】给出准确、自然、符合上下文的简体中文句意。',
  '【语法结构拆分】紧接句意之后，把原句按语法成分拆成有顺序的编号条目。每条必须引用原句中对应的英文片段（不得改写、不得只写语法术语），并说明其结构功能，例如主语 Subject、谓语 Verb、宾语 Object、表语 Complement、修饰语 Modifier、介词短语、从句、非谓语结构。先呈现句子主干，再按原文顺序拆解其余结构；长句要覆盖完整。',
  '【人名、头衔与地名识别】分别列出明确的人名、姓名中的尊称/头衔/职位（如 Mr., Dr., Professor, President 等）及地名，说明头衔对应的人物以及地理实体类型。必须结合上下文判断，不要把普通名词误判成人名或地名；无法确认时标注“存在歧义”。没有明确实体时写“未发现明确的人名、头衔或地名”。',
  '【其他语法要点】将时态、语态、从句关系、修饰关系、语气等解释逐条编号，不要写成混合长段。',
  '【词汇与搭配】将重要词义、固定搭配、语域或语用说明逐条编号；没有必要内容时可省略。',
  level==='paragraph'?'【段落逻辑】最后用编号条目说明各句之间的指代、因果、转折或递进关系。':'',
  '所有解释分条列举，不要把句意、结构、词汇和语法揉成一段。除栏目标题、原句和句意外，解释尽量使用编号列表。不要提供原文没有的信息或例句。'
 ].filter(Boolean).join('\n');
 try{
  const out=await ai([{role:'system',content:instruction},{role:'user',content:(level==='paragraph'?'请逐句解析以下整段：\n':'请解析以下整句：\n')+target}],{temperature:.1,maxTokens:level==='paragraph'?5200:2200,timeout:120000});
  if(my!==transTok)return;
  el.className='sheet-trans analysis';renderAnalysis(el,out);
 }catch(e){if(my!==transTok)return;el.className='sheet-trans';el.textContent=e.message||'AI 分析失败'}
 revealTrans();
}
$('#sh-sentence-ai').addEventListener('click',()=>explainSelection('sentence'));$('#sh-paragraph-ai').addEventListener('click',()=>explainSelection('paragraph'));
$('#sh-trans').addEventListener('click',async()=>{
 const s=SENTS[sel.si];if(!s)return;
 const el=$('#sheet-trans'),my=++transTok;el.hidden=false;el.className='sheet-trans load';el.textContent='正在翻译…';
 requestAnimationFrame(adjustForSheet);
 try{
  const out=await ai([{role:'system',content:'把用户给出的句子翻译成自然流畅的简体中文（若是中文则译成英文）。只输出译文。'},{role:'user',content:s.text}],{temperature:.1,maxTokens:500,timeout:40000});
  if(my!==transTok)return;el.className='sheet-trans';el.textContent=out;
 }catch(e){if(my!==transTok)return;el.className='sheet-trans';el.textContent=e.message}
 requestAnimationFrame(adjustForSheet);
});

/* ---------- 字号 / 设置 ---------- */
function setFont(n){S.font=Math.min(40,Math.max(16,n));save();applyFont();requestAnimationFrame(updateFocus)}
function setLine(n){S.line=Math.min(2.4,Math.max(1.3,n));save();applyTypography()}
function setPara(n){S.para=Math.min(1.8,Math.max(.1,n));save();applyTypography()}
function setAlign(v){S.align=['left','justify','center'].includes(v)?v:'left';save();applyTypography()}
$('#line-range').addEventListener('input',e=>setLine(+e.target.value));$('#para-range').addEventListener('input',e=>setPara(+e.target.value));document.querySelectorAll('#align-seg button').forEach(b=>b.addEventListener('click',()=>setAlign(b.dataset.align)));
$('#btn-font-dec').addEventListener('click',()=>setFont(S.font-1));
$('#btn-font-inc').addEventListener('click',()=>setFont(S.font+1));
$('#font-range').addEventListener('input',e=>setFont(+e.target.value));
$$('#theme-seg button').forEach(b=>b.addEventListener('click',()=>{S.theme=b.dataset.t;save();applyTheme()}));
$('#focus-sw').checked=!!S.focus;
$('#focus-sw').addEventListener('change',e=>{S.focus=e.target.checked;save();bodyEl.classList.toggle('focus-on',S.focus);updateFocus()});
bodyEl.classList.toggle('focus-on',!!S.focus);
$('#api-key').value=S.api;$('#base-url').value=S.base;$('#model').value=S.model;
$('#btn-save').addEventListener('click',()=>{
 const url=$('#base-url').value.trim()||'https://api.deepseek.com';
 try{const u=new URL(url);if(!/^https?:$/.test(u.protocol))throw 0}catch(e){$('#save-status').textContent='接口地址无效';return}
 S.api=$('#api-key').value.trim();S.base=url.replace(/\/+$/,'');S.model=$('#model').value.trim()||'deepseek-chat';save();cache.clear();
 $('#save-status').textContent='已保存';setTimeout(()=>{$('#save-status').textContent=''},1600);
});
$('#btn-reset').addEventListener('click',()=>{S.stats={calls:0,prompt:0,completion:0,total:0};save();renderStats()});

/* ---------- 初始化 ---------- */
applyTheme();applyFont();applyTypography();renderStats();
$('#btn-favorite').innerHTML=ICON.star;
if(S.article){
 current={id:hash(S.article),content:S.article};S.pos=progressFor(current.id);S.posId=current.id;
 render(S.article);updateFavBtn();updateResume();
 tab('read');requestAnimationFrame(()=>restoreReadPosition(current.id,S.pos));
}else{render('');updateResume()}
})();
</script>
