<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eaed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="阅读">
<title>英文阅读</title>
<style>
:root{--white:#fff;--bg:#f3f3f3;--soft:#f7f7f7;--line:#e5e5e5;--ink:#292929;--mid:#666;--muted:#999;--dark:#333;--reader-size:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
body{height:100vh;height:100dvh;display:flex;justify-content:center;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
#app{width:100%;max-width:900px;height:100%;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{display:none;height:auto;min-height:58px;padding:calc(13px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);flex:none}
.brand{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--dark)}.brand small{display:block;margin-top:3px;font-size:9px;letter-spacing:2px;color:var(--muted);font-weight:600}
.top-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow:hidden;position:relative}
.panel{display:none;width:100%;height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom))}
.panel.active{display:block}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 auto 13px;max-width:780px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h2{margin:0;font-size:14px;font-weight:750;color:var(--dark)}.hint{font-size:11px;color:var(--muted);line-height:1.5}
textarea{display:block;width:100%;min-height:40vh;max-height:58vh;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#fafafa;padding:14px;color:var(--ink);font-size:14px;line-height:1.75;outline:none}
textarea:focus,input:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.045);outline:none}
.btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:38px;padding:9px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#555;font-size:12px;font-weight:700}
.btn.primary{background:#333;color:#fff;border-color:#333}.btn:disabled{opacity:.45;cursor:wait}
.status{font-size:11px;color:var(--muted);line-height:1.5}.status.ok{color:#555}.status.bad{color:#a44}
.input-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.reader-wrap{height:100%;display:flex;flex-direction:column;min-height:0}
.reader-toolbar{flex:none;display:flex;align-items:center;gap:7px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.icon-btn{height:34px;min-width:35px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:#fafafa;color:#555;font-size:12px;font-weight:650}
.icon-btn.active{background:#eee;border-color:#ccc;color:#222}
.font-tools{margin-left:auto;display:flex;align-items:center;gap:5px;color:#888;font-size:10px}
#reader-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 22px calc(30px + env(safe-area-inset-bottom))}
.reading-document{max-width:740px;margin:0 auto}
.reader-title{font-size:19px;line-height:1.45;font-weight:750;margin:0 0 7px;color:#333}
.reader-meta{font-size:10px;color:#999;margin-bottom:20px}
.article-body{font-size:var(--reader-size);line-height:1.85;letter-spacing:.005em;color:#333;text-align:justify;overflow-wrap:break-word;word-break:normal}
.article-paragraph{margin:0 0 1.15em;text-align:justify}
.article-sentence{border-radius:3px;transition:background .15s}
.article-body.has-focus .article-sentence:not(.is-focused){color:#858585}.article-sentence.is-focused{background:#e3e3e3;box-shadow:0 0 0 3px #e3e3e3;color:#202020;font-weight:550;border-radius:4px}
.article-sentence mark{background:#d9d9d9;color:inherit;border-radius:2px;padding:0 2px}
.empty{padding:30px 15px;text-align:center;color:#999;font-size:12px;line-height:1.8;border:1px dashed #ddd;border-radius:12px;background:#fafafa}
.list{display:grid;gap:9px;max-width:780px;margin:0 auto}
.saved-item{display:flex;align-items:center;gap:10px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:12px}
.saved-main{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:#333;padding:0}
.saved-title{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-meta{font-size:10px;color:#999;margin-top:5px}
.small-btn{border:1px solid var(--line);border-radius:8px;background:#fafafa;color:#666;padding:7px 9px;font-size:10px}
.word-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.word-chip{padding:7px 10px;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:8px;font-size:12px;color:#444}
.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;color:#666;font-weight:650}
.field input,.field select{width:100%;height:40px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fafafa;color:#333;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:12px 7px;background:#f7f7f7;border-radius:10px;text-align:center}.stat b{display:block;font-size:17px;color:#333}.stat span{font-size:9px;color:#999}
.bottom-nav{flex:none;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.tab{height:43px;border:0;background:transparent;color:#999;font-size:11px;font-weight:650}.tab.active{color:#222;font-weight:800}
.selection-popup{display:none;position:fixed;z-index:60;width:min(280px,calc(100vw - 24px));padding:8px;background:#333;color:#fff;border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.popup-actions{display:flex;gap:6px}.popup-actions button{flex:1;border:0;border-radius:7px;background:#555;color:#fff;padding:8px 5px;font-size:11px}.popup-actions button:last-child{flex:0 0 34px}
.meaning{padding:9px 5px 3px;font-size:11px;line-height:1.6;color:#eee}.meaning[hidden]{display:none}
@media(min-width:700px){.panel{padding:24px 30px 95px}.reader-toolbar{padding-left:30px;padding-right:30px}#reader-scroll{padding:30px 40px}.topbar{padding-left:30px;padding-right:30px}}
@media(max-width:480px){.panel{padding:calc(13px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}.card{padding:13px;border-radius:14px}textarea{min-height:42vh;font-size:14px}.reader-toolbar{gap:5px;padding:8px 10px}.icon-btn{min-width:32px;height:33px;padding:0 7px}#reader-scroll{padding:17px 17px 30px}.article-body{line-height:1.82}.grid2{grid-template-columns:1fr}}

/* Liquid glass visual layer */
:root{
  --bg:#eaebee;--soft:rgba(255,255,255,.56);--line:rgba(255,255,255,.78);
  --ink:#25272b;--mid:#666a70;--muted:#92969d;--dark:#292c31;
}
html,body{background:#e9eaed}
body{
  background:
    radial-gradient(ellipse at 12% 7%,rgba(255,255,255,.96),transparent 38%),
    radial-gradient(ellipse at 88% 20%,rgba(211,215,222,.72),transparent 34%),
    radial-gradient(ellipse at 55% 100%,rgba(255,255,255,.78),transparent 42%),
    #e9eaed;
}
#app{
  background:linear-gradient(155deg,rgba(255,255,255,.52),rgba(242,243,245,.44) 48%,rgba(228,230,234,.5));
  isolation:isolate;
}
main{z-index:1}
.panel{scrollbar-width:thin;scrollbar-color:rgba(90,94,101,.25) transparent}
.card,.saved-item{
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.48));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 12px 32px rgba(38,42,49,.055),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
  backdrop-filter:blur(24px) saturate(170%);
}
.card{border-radius:22px;padding:18px}
textarea,.field input,.field select{
  background:rgba(255,255,255,.48);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 3px rgba(38,42,49,.035),0 4px 14px rgba(38,42,49,.025);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
textarea{border-radius:17px}
textarea:focus,.field input:focus,.field select:focus{
  border-color:rgba(118,123,132,.48);
  box-shadow:0 0 0 4px rgba(120,125,134,.09),inset 0 1px 3px rgba(38,42,49,.035);
}
.btn,.small-btn,.icon-btn{
  background:rgba(255,255,255,.52);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 4px 12px rgba(35,39,46,.045),inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px) saturate(155%);
  backdrop-filter:blur(16px) saturate(155%);
  transition:transform .16s ease,background .16s ease,box-shadow .16s ease;
}
.btn{border-radius:14px}
.btn.primary{
  color:#fff;border-color:rgba(35,38,43,.72);
  background:linear-gradient(145deg,rgba(68,72,79,.96),rgba(35,38,43,.96));
  box-shadow:0 7px 18px rgba(35,38,43,.16),inset 0 1px 0 rgba(255,255,255,.22);
}
.icon-btn{border-radius:12px}
.icon-btn.active,.small-btn:active,.btn:active{
  background:rgba(218,221,226,.72);box-shadow:inset 0 1px 5px rgba(35,39,46,.08);
}
.reader-toolbar{
  background:rgba(246,247,249,.62);
  border-bottom:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 22px rgba(38,42,49,.035);
  -webkit-backdrop-filter:blur(28px) saturate(175%);
  backdrop-filter:blur(28px) saturate(175%);
}
#reader-scroll{background:transparent}
.reader-title{letter-spacing:-.025em}
.article-body.has-focus .article-sentence:not(.is-focused){color:#92969c}
.article-sentence.is-focused{
  background:rgba(127,133,143,.17);
  box-shadow:0 0 0 4px rgba(127,133,143,.17);
  color:#202329;
}
.empty{
  background:rgba(255,255,255,.38);
  border:1px dashed rgba(150,154,162,.42);
  border-radius:18px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.saved-item{border-radius:17px}
.word-chip{
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.86);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(38,42,49,.035);
}
.stat{
  background:rgba(255,255,255,.43);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82);
  border-radius:15px;
}
.bottom-nav{
  margin:0 12px calc(8px + env(safe-area-inset-bottom));
  padding:7px 8px;
  border:1px solid rgba(255,255,255,.92);
  border-radius:23px;
  background:rgba(250,250,252,.62);
  box-shadow:0 12px 34px rgba(39,43,50,.12),inset 0 1px 0 rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(30px) saturate(185%);
  backdrop-filter:blur(30px) saturate(185%);
}
.tab{height:43px;border-radius:16px;transition:background .18s ease,color .18s ease}
.tab.active{
  color:#23262b;
  background:rgba(215,218,224,.42);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.85),0 2px 8px rgba(40,44,51,.045);
}
.selection-popup{
  background:rgba(43,46,52,.78);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 38px rgba(20,22,26,.22),inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
  backdrop-filter:blur(24px) saturate(150%);
}
.popup-actions button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);border-radius:9px}
@media(hover:hover){
  .btn:not(:disabled):hover,.icon-btn:hover,.small-btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.78)}
  .tab:not(.active):hover{background:rgba(255,255,255,.34);color:#555b63}
}
@media(max-width:480px){
  .card{padding:15px;border-radius:20px}
  .bottom-nav{margin-left:10px;margin-right:10px;border-radius:22px}
}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){
  .card,.saved-item,.reader-toolbar,.bottom-nav,.selection-popup{background:rgba(255,255,255,.94)}
  .selection-popup{background:rgba(43,46,52,.96)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}


/* Status-bar color continuity: keep the safe-area backdrop flat */
html,body,#app{background:#e9eaed!important}
body{background-color:#e9eaed!important;background-image:none!important}
#app{background:#e9eaed!important}
#app::before{
  content:"";position:absolute;z-index:0;pointer-events:none;
  top:calc(env(safe-area-inset-top) + 2px);right:0;bottom:0;left:0;
  background:
    radial-gradient(ellipse at 12% 7%,rgba(255,255,255,.96),transparent 38%),
    radial-gradient(ellipse at 88% 20%,rgba(211,215,222,.72),transparent 34%),
    radial-gradient(ellipse at 55% 100%,rgba(255,255,255,.78),transparent 42%),
    linear-gradient(155deg,rgba(255,255,255,.34),rgba(242,243,245,.18) 48%,rgba(228,230,234,.24));
}
main{position:relative;z-index:1}
.bottom-nav{position:relative;z-index:20}

</style>
</head>
<body>
<div id="app">

<main>
<section class="panel active" id="panel-paste">
 <div class="card">
  <div class="section-head"><h2>粘贴英文内容</h2><span class="hint" id="input-count">0 / 120,000</span></div>
  <textarea id="raw-input" maxlength="120000" placeholder="在这里粘贴英文文章、网页正文或学习材料……"></textarea>
  <div class="input-foot"><span>支持长文章 · 自动保存在本机</span><span id="word-count">0 words</span></div>
  <div class="btn-row"><button class="btn primary" id="btn-clean">AI 整理并开始阅读</button><button class="btn" id="btn-read-direct">直接阅读</button><button class="btn" id="btn-clear">清空</button></div>
  <div class="status" id="paste-status" role="status" aria-live="polite"></div>
 </div>
 <div class="card">
  <div class="section-head"><h2>阅读说明</h2></div>
  <div class="hint">粘贴英文后，可选择 AI 清理网页噪音，也可以直接进入阅读。阅读时支持字号调整、句子聚焦、选词查义、朗读和收藏。</div>
 </div>
</section>
<section class="panel" id="panel-read" style="padding:0;overflow:hidden">
 <div class="reader-wrap">
  <div class="reader-toolbar">
   <button class="icon-btn" id="btn-back">返回</button>
   <button class="icon-btn" id="btn-favorite" title="收藏文章">☆</button>
   <button class="icon-btn" id="btn-speak">朗读</button><button class="icon-btn" id="btn-copy-article">复制格式</button>
   <button class="icon-btn" id="btn-stop">停止</button>
   <div class="font-tools"><button class="icon-btn" id="font-down">A−</button><span id="font-label">21</span><button class="icon-btn" id="font-up">A+</button></div>
  </div>
  <div id="reader-scroll"><article class="reading-document"><h1 class="reader-title" id="reader-title"></h1><div class="reader-meta" id="reader-meta"></div><div class="article-body" id="article-body"><div class="empty">请先粘贴英文文章。</div></div></article></div>
 </div>
</section>
<section class="panel" id="panel-saved">
 <div class="section-head"><h2>文章收藏</h2><span class="hint" id="saved-count">0 篇</span></div>
 <div class="list" id="saved-list"><div class="empty">收藏的文章会保存在当前设备。</div></div>
 <div class="card" style="margin-top:14px"><div class="section-head"><h2>生词本</h2><button class="small-btn" id="btn-copy-words">复制全部</button></div><div class="hint" id="word-empty">选中阅读中的单词，点击「加生词」即可收集。</div><div class="word-list" id="word-list"></div></div>
</section>
<section class="panel" id="panel-settings">
 <div class="card">
  <div class="section-head"><h2>AI 设置</h2><span class="hint">用于网页清理与查词</span></div>
  <div class="field"><label for="api-key">DeepSeek API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="sk-…"></div>
  <div class="grid2">
   <div class="field"><label for="base-url">接口地址</label><input id="base-url" value="https://api.deepseek.com"></div>
   <div class="field"><label for="model">模型</label><select id="model"><option value="deepseek-flash">deepseek-flash</option><option value="deepseek-v4-pro">deepseek-v4-pro</option></select></div>
  </div>
  <div class="btn-row"><button class="btn primary" id="btn-save">保存设置</button><span class="status" id="save-status"></span></div>
  <p class="hint" style="margin-top:12px">API Key 仅保存在当前浏览器的本地存储中。请勿在公共设备保存密钥。</p>
 </div>
 <div class="card">
  <div class="section-head"><h2>Token 统计</h2><button class="small-btn" id="btn-reset">重置</button></div>
  <div class="stats"><div class="stat"><b id="stat-calls">0</b><span>调用次数</span></div><div class="stat"><b id="stat-prompt">0</b><span>输入 tokens</span></div><div class="stat"><b id="stat-completion">0</b><span>输出 tokens</span></div><div class="stat"><b id="stat-total">0</b><span>总 tokens</span></div></div>
 </div>
</section>
</main>
<nav class="bottom-nav" aria-label="主导航"><button class="tab active" data-tab="paste">粘贴</button><button class="tab" data-tab="read">阅读</button><button class="tab" data-tab="saved">收藏</button><button class="tab" data-tab="settings">设置</button></nav>
<div class="selection-popup" id="selection-popup" role="dialog" aria-label="选词工具"><div class="popup-actions"><button id="pop-lookup">查词</button><button id="pop-add">加生词</button><button id="pop-copy">复制</button><button id="pop-close">×</button></div><div class="meaning" id="pop-meaning" hidden></div></div>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const KEY='manageplan_read_v1';
const defaults={api:'',base:'https://api.deepseek.com',model:'deepseek-flash',input:'',article:'',title:'我的英文文章',font:24,favorites:[],words:[],stats:{calls:0,prompt:0,completion:0,total:0}};
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
let S=load(),current={id:'',title:S.title||'我的英文文章',content:S.article||''},pending='',focusFrame=0;
S.favorites=Array.isArray(S.favorites)?S.favorites:[];S.words=Array.isArray(S.words)?S.words:[];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
function wordCount(t){return (String(t||'').match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]).length}
function updateCount(){const t=$('#raw-input').value;$('#input-count').textContent=t.length.toLocaleString()+' / 120,000';$('#word-count').textContent=wordCount(t).toLocaleString()+' words'}
function showStatus(msg,type){const e=$('#paste-status');e.textContent=msg;e.className='status '+(type||'')}
function tab(name){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$$('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));if(name==='saved')renderSaved();if(name==='read')requestAnimationFrame(scheduleFocus)}
$$('.tab').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function splitParagraphs(t){const raw=String(t||'').replace(/\r\n?/g,'\n').replace(/[\u2028\u2029]/g,'\n').trim();if(!raw)return [];const hasBlank=/\n[\t ]*\n+/.test(raw);return raw.split(hasBlank?/\n[\t ]*\n+/:/\n+/).map(x=>x.replace(/[\t ]+/g,' ').trim()).filter(Boolean)}
function sentences(p){return (String(p).match(/[^.!?]+[.!?]+[”’"'»）)\]}】』」]*|[^.!?]+$/g)||[p]).map(x=>x.trim()).filter(Boolean)}
function renderArticle(t){const ps=splitParagraphs(t);if(!ps.length)return '<div class="empty">没有可显示的正文内容。</div>';return ps.map(p=>'<p class="article-paragraph">'+sentences(p).map(s=>'<span class="article-sentence">'+esc(s)+'</span>').join(' ')+'</p>').join('')}
function openArticle(t,title){current={id:'article-'+Date.now(),title:title||'我的英文文章',content:t};S.article=t;S.title=current.title;save();$('#reader-title').textContent=current.title;$('#reader-meta').textContent=wordCount(t).toLocaleString()+' words · '+t.length.toLocaleString()+' characters';$('#article-body').innerHTML=renderArticle(t);$('#reader-scroll').scrollTop=0;updateFavoriteButton();tab('read');updateFocus()}
function updateTopCount(){}
function setFont(n){S.font=Math.max(18,Math.min(34,Number(n)||24));document.documentElement.style.setProperty('--reader-size',S.font+'px');$('#font-label').textContent=S.font;save()}
$('#font-down').addEventListener('click',()=>setFont(S.font-2));$('#font-up').addEventListener('click',()=>setFont(S.font+2));
function scheduleFocus(){if(focusFrame)return;focusFrame=requestAnimationFrame(()=>{focusFrame=0;updateFocus()})}
function updateFocus(){if(!$('#panel-read').classList.contains('active'))return;const root=$('#reader-scroll'),body=$('#article-body'),r=root.getBoundingClientRect(),target=r.top+r.height*.43;let best=null,dist=Infinity;body.querySelectorAll('.article-sentence').forEach(el=>{Array.from(el.getClientRects()).forEach(q=>{if(q.bottom<r.top+10||q.top>r.bottom-20)return;const d=Math.abs((q.top+q.bottom)/2-target);if(d<dist){dist=d;best=el}})});body.querySelectorAll('.is-focused').forEach(x=>x.classList.remove('is-focused'));body.classList.toggle('has-focus',!!best);if(best)best.classList.add('is-focused')}
$('#reader-scroll').addEventListener('scroll',scheduleFocus,{passive:true});
function base(){let u;try{u=new URL(S.base.replace(/\/+$/,''))}catch(e){throw Error('接口地址格式不正确')}if(!['https:','http:'].includes(u.protocol))throw Error('接口地址只支持 HTTP 或 HTTPS');return u.href.replace(/\/+$/,'')}
async function ai(messages,opt){if(!S.api)throw Error('请先到「设置」填写 API Key');const body={model:S.model,messages,temperature:opt&&opt.temperature!==undefined?opt.temperature:.15,max_tokens:opt&&opt.maxTokens||8192};if(opt&&opt.json)body.response_format={type:'json_object'};const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),90000);try{const res=await fetch(base()+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.api},body:JSON.stringify(body),signal:ctl.signal});const raw=await res.text();let d;try{d=JSON.parse(raw)}catch(e){}if(!res.ok)throw Error('API '+res.status+'：'+(d&&d.error&&d.error.message||raw.slice(0,160)));const content=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;if(typeof content!=='string'||!content.trim())throw Error('模型没有返回内容');if(d.usage){S.stats.calls++;S.stats.prompt+=Number(d.usage.prompt_tokens)||0;S.stats.completion+=Number(d.usage.completion_tokens)||0;S.stats.total+=Number(d.usage.total_tokens)||0;save();renderStats()}return content.trim()}catch(e){if(e.name==='AbortError')throw Error('请求超时');if(e instanceof TypeError)throw Error('网络请求失败，请检查网络或接口跨域设置');throw e}finally{clearTimeout(timer)}}
function parseText(raw){return String(raw||'').trim().replace(/^\x60{3}(?:text)?\s*/i,'').replace(/\s*\x60{3}$/,'').trim()}
$('#btn-clean').addEventListener('click',async()=>{const t=$('#raw-input').value.trim();if(!t){showStatus('请先粘贴英文内容','bad');return}const b=$('#btn-clean');b.disabled=true;showStatus('AI 正在清理网页噪音，请稍候…');try{const out=parseText(await ai([{role:'system',content:'You are an expert English web-page text cleaner. Remove navigation menus, advertisements, cookie notices, comments, unrelated recommendations, repeated headers and footers. Preserve the original English title, paragraphs, sentences, quotations, punctuation and wording. Do not summarize, translate, rewrite or add content. Return only the cleaned original text.'},{role:'user',content:t}],{temperature:.05,maxTokens:12000}));if(!out)throw Error('没有提取到正文');S.input=t;save();openArticle(out,'我的英文文章');showStatus('清理完成 · '+wordCount(out).toLocaleString()+' words','ok')}catch(e){showStatus(e.message,'bad')}finally{b.disabled=false}});
$('#btn-read-direct').addEventListener('click',()=>{const t=$('#raw-input').value.trim();if(!t){showStatus('请先粘贴英文内容','bad');return}S.input=t;save();openArticle(t,'我的英文文章');showStatus('已直接载入阅读','ok')});
$('#btn-clear').addEventListener('click',()=>{$('#raw-input').value='';S.input='';save();updateCount();showStatus('输入内容已清空')});
$('#raw-input').value=S.input||'';$('#raw-input').addEventListener('input',()=>{S.input=$('#raw-input').value;save();updateCount()});updateCount();setFont(S.font);updateTopCount();
$('#btn-back').addEventListener('click',()=>tab('paste'));
function favKey(a){return a.id||a.title+':'+a.content.slice(0,80)}
function isFavorite(){return S.favorites.some(x=>favKey(x)===favKey(current))}
function updateFavoriteButton(){$('#btn-favorite').textContent=isFavorite()?'★':'☆';$('#btn-favorite').classList.toggle('active',isFavorite())}
$('#btn-favorite').addEventListener('click',()=>{if(!current.content)return;if(isFavorite())S.favorites=S.favorites.filter(x=>favKey(x)!==favKey(current));else S.favorites.unshift({...current,createdAt:Date.now()});save();updateFavoriteButton();renderSaved()});
function renderSaved(){const box=$('#saved-list');box.innerHTML='';$('#saved-count').textContent=S.favorites.length+' 篇';if(!S.favorites.length){box.innerHTML='<div class="empty">收藏的文章会保存在当前设备。</div>';return}S.favorites.forEach((a,i)=>{const row=document.createElement('div');row.className='saved-item';const open=document.createElement('button');open.className='saved-main';open.innerHTML='<div class="saved-title">'+esc(a.title||'未命名文章')+'</div><div class="saved-meta">'+wordCount(a.content).toLocaleString()+' words · '+new Date(a.createdAt||Date.now()).toLocaleDateString()+'</div>';open.addEventListener('click',()=>openArticle(a.content,a.title));const del=document.createElement('button');del.className='small-btn';del.textContent='删除';del.addEventListener('click',()=>{S.favorites.splice(i,1);save();renderSaved();updateFavoriteButton()});row.append(open,del);box.append(row)})}
function renderWords(){const box=$('#word-list');box.innerHTML='';$('#word-empty').style.display=S.words.length?'none':'block';S.words.forEach((w,i)=>{const b=document.createElement('button');b.className='word-chip';b.textContent=w+' ×';b.title='点击移除';b.addEventListener('click',()=>{S.words.splice(i,1);save();renderWords()});box.append(b)})}
renderSaved();renderWords();
function hidePopup(){const p=$('#selection-popup');p.style.display='none';pending='';$('#pop-meaning').hidden=true;$('#pop-meaning').textContent=''}
function showPopup(rect,v){pending=v;const p=$('#selection-popup');$('#pop-meaning').hidden=true;$('#pop-meaning').textContent='';p.style.display='block';requestAnimationFrame(()=>{const w=p.offsetWidth,h=p.offsetHeight,left=Math.max(10,Math.min(rect.left,innerWidth-w-10));let top=rect.top-h-8;if(top<5)top=Math.min(innerHeight-h-8,rect.bottom+8);p.style.left=left+'px';p.style.top=top+'px'})}
function selection(){setTimeout(()=>{const s=getSelection(),v=s?s.toString().trim():'';if(!v||v.length>80||!s.rangeCount||!$('#article-body').contains(s.getRangeAt(0).commonAncestorContainer)){hidePopup();return}showPopup(s.getRangeAt(0).getBoundingClientRect(),v)},30)}
$('#article-body').addEventListener('mouseup',selection);$('#article-body').addEventListener('touchend',selection);document.addEventListener('selectionchange',()=>{if($('#panel-read').classList.contains('active'))selection()});$('#pop-close').addEventListener('click',hidePopup);$('#pop-copy').addEventListener('click',async()=>{const v=pending;if(!v)return;await copyText(v);$('#pop-copy').textContent='已复制';setTimeout(()=>$('#pop-copy').textContent='复制',1000)});document.addEventListener('pointerdown',e=>{if(!$('#selection-popup').contains(e.target)&&!$('#article-body').contains(e.target))hidePopup()});
$('#pop-add').addEventListener('click',()=>{const v=pending.trim();if(v&&!S.words.some(w=>w.toLowerCase()===v.toLowerCase())){S.words.unshift(v);save();renderWords()}hidePopup()});
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();document.execCommand('copy');a.remove()}}
$('#btn-copy-article').addEventListener('click',async()=>{const paragraphs=splitParagraphs(current.content||'');const formatted=[current.title||'英文文章',...paragraphs].join('\n\n');if(!paragraphs.length)return;await copyText(formatted);const b=$('#btn-copy-article');b.textContent='已复制';setTimeout(()=>b.textContent='复制格式',1200)});
$('#pop-lookup').addEventListener('click',async()=>{if(!pending)return;const v=pending,m=$('#pop-meaning');m.hidden=false;m.textContent='查询中…';try{m.textContent=await ai([{role:'system',content:'You are a concise English-Chinese dictionary. Explain the given English word or phrase in Chinese. Include part of speech, pronunciation if useful, and the meaning in this sentence if context is available. Keep it concise.'},{role:'user',content:v}],{temperature:0,maxTokens:220})}catch(e){m.textContent=e.message}});
$('#btn-speak').addEventListener('click',()=>{if(!current.content)return;if(!('speechSynthesis'in window)){showStatus('当前浏览器不支持朗读');return}speechSynthesis.cancel();const parts=splitParagraphs(current.content);parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang='en-US';u.rate=.94;speechSynthesis.speak(u)});$('#btn-speak').classList.add('active')});
$('#btn-stop').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();$('#btn-speak').classList.remove('active')});
$('#btn-save').addEventListener('click',()=>{const key=$('#api-key').value.trim(),url=$('#base-url').value.trim()||'https://api.deepseek.com';try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch(e){$('#save-status').textContent='接口地址无效';return}S.api=key;S.base=url.replace(/\/+$/,'');S.model=$('#model').value;save();$('#save-status').textContent='设置已保存'});
$('#api-key').value=S.api;$('#base-url').value=S.base;$('#model').value=S.model;
function renderStats(){['calls','prompt','completion','total'].forEach(k=>$('#stat-'+k).textContent=Number(S.stats[k]||0).toLocaleString())}
renderStats();$('#btn-reset').addEventListener('click',()=>{S.stats={calls:0,prompt:0,completion:0,total:0};save();renderStats()});
$('#btn-copy-words').addEventListener('click',async()=>{if(!S.words.length)return;const t=S.words.join('\n');try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}$('#btn-copy-words').textContent='已复制';setTimeout(()=>$('#btn-copy-words').textContent='复制全部',1200)});
if(S.article){current={id:'stored',title:S.title||'上次阅读文章',content:S.article};$('#reader-title').textContent=current.title;$('#reader-meta').textContent=wordCount(current.content)+' words';$('#article-body').innerHTML=renderArticle(current.content);updateFavoriteButton()}if(!S.font||S.font<24)setFont(24);
})();
</script>
</body></html>
