<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>单词记忆助手</title>
<style>
:root{
  --primary:#2c5e4f;
  --primary-light:#f0f5f3;
  --bg-color:#fafafa;
  --text-main:#222222;
  --text-muted:#999999;
  --white:#ffffff;
  --red:#d93b3b;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background-color:var(--bg-color);color:var(--text-main);
  display:flex;justify-content:center;height:100vh;overflow:hidden;
}
#app{
  width:100%;max-width:480px;background-color:var(--white);
  position:relative;height:100%;display:flex;flex-direction:column;
}
.header{
  padding:20px 20px 10px;font-size:22px;font-weight:600;
  color:var(--primary);text-align:center;letter-spacing:1px;
}
.content{flex:1;overflow-y:auto;padding:0 20px 100px 20px;display:none;}
.content.active{display:block;}

/* ============ 搜索框 ============ */
.search-container{position:relative;display:flex;align-items:center;margin-bottom:16px;}
.search-box{
  width:100%;padding:14px 45px 14px 45px;border-radius:30px;border:none;
  background-color:var(--bg-color);font-size:15px;outline:none;transition:background .2s;
}
.search-box:focus{background-color:#eee;}
.icon-search,.icon-add{
  position:absolute;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text-muted);height:100%;width:45px;
}
.icon-search{right:0;color:var(--primary);}
.icon-add{left:0;}

/* ============ 粘贴区（固定大小，不允许拖大） ============ */
.paste-box{
  width:100%;
  height:120px; /* 固定高度 */
  padding:14px;
  border-radius:14px;
  border:1px dashed #d5e0db;
  background:var(--primary-light);
  font-size:14px;
  line-height:1.6;
  resize:none; /* 禁止拖拽调整大小 */
  overflow-y:auto; /* 内容超出时内部滚动 */
  outline:none;
  font-family:inherit;
  color:var(--text-main);
}
.paste-box::placeholder{color:#a8b5af;}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn-primary{
  flex:1;padding:14px;background:var(--primary);color:#fff;border:none;
  border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;
}
.btn-primary:disabled{opacity:.5;}
.btn-outline{
  padding:14px 20px;background:var(--white);color:var(--primary);
  border:1px solid var(--primary);border-radius:12px;font-size:15px;cursor:pointer;
}
.section-label{
  font-size:12px;color:var(--text-muted);letter-spacing:1px;
  margin:24px 0 10px;font-weight:600;
}

/* ============ 识别状态 ============ */
.empty-hint{font-size:13px;color:#bbb;text-align:center;padding:24px 0;}
.status-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  font-size:13px;background:var(--bg-color);border-radius:12px;margin-bottom:8px;
  animation:fadeIn .3s ease;
}
.status-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#ccc;}
.status-item .dot.loading{background:var(--primary);animation:pulse 1s infinite;}
.status-item .dot.done{background:#3aab6d;}
.status-item .dot.fail{background:#e05555;}
.status-item .st-word{font-weight:600;color:var(--text-main);}
.status-item .st-msg{margin-left:auto;color:var(--text-muted);font-size:12px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

/* ============ 设置与统计区 ============ */
.settings-wrapper{margin-top:32px;border-top:1px solid #f0f0f0;padding-top:20px;}
.stats-box{background:var(--bg-color);padding:20px;border-radius:var(--radius);margin-bottom:16px;}
.stats-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;}
.stats-row:last-child{margin-bottom:0;}
.stats-val{font-weight:600;color:var(--primary);}
.setting-item{margin-bottom:16px;}
.setting-item label{display:block;font-size:13px;margin-bottom:8px;color:var(--text-muted);}
.setting-item input{
  width:100%;padding:14px;border:1px solid #eee;background:var(--bg-color);
  border-radius:12px;font-size:15px;outline:none;
}

/* ============ 单词卡片 ============ */
.flashcard-container{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:15px;
  padding:10px 0;height:calc(100vh - 160px);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.flashcard-container::-webkit-scrollbar{display:none;}
.flashcard{
  flex:0 0 88%;scroll-snap-align:center;background:var(--bg-color);
  border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;
  position:relative;
}
.card-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #eee;
}
.word-big{
  font-size:34px;font-weight:700;color:var(--red);
  letter-spacing:.5px;line-height:1.15;word-break:break-word;
}
.word-phonetic{font-size:14px;color:#777;margin-top:6px;}
.word-syllable{
  font-size:13px;color:var(--primary);margin-top:3px;
  letter-spacing:1.5px;font-weight:500;
}
.delete-btn{
  color:#ff4d4f;font-size:13px;background:none;border:none;
  cursor:pointer;flex-shrink:0;padding-left:8px;
}
.card-body{flex:1;overflow-y:auto;font-size:14px;line-height:1.65;color:#444;}
.sec{margin-bottom:14px;}
.sec:last-child{margin-bottom:0;}
.sec-label{
  font-size:11px;color:var(--primary);font-weight:700;letter-spacing:1px;
  margin-bottom:5px;
}
.sec-body{font-size:14px;line-height:1.65;color:#333;white-space:pre-line;}
.sec-body.en{font-family:Georgia,"Times New Roman",serif;color:#3a3a3a;}
.card-footer{
  margin-top:14px;padding-top:14px;border-top:1px solid #eee;
  font-size:12px;color:var(--text-muted);text-align:center;
}
.empty-state{
  width:100%;text-align:center;color:var(--text-muted);
  margin-top:100px;font-size:14px;
}

/* ============ 清单 ============ */
.clock-card{
  background:linear-gradient(135deg,#2c5e4f,#3d7a66);color:#fff;
  border-radius:var(--radius);padding:20px;margin-bottom:18px;
  box-shadow:0 6px 20px rgba(44,94,79,.18);
}
.clock-time{font-size:38px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.clock-date{font-size:13px;opacity:.85;margin-top:4px;}
.clock-log{font-size:12px;opacity:.9;margin-top:12px;line-height:1.7;}
.clock-actions{display:flex;gap:10px;margin-top:14px;}
.clock-actions button{
  flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.14);color:#fff;font-size:14px;cursor:pointer;
}
.clock-actions button:active{background:rgba(255,255,255,.28);}

.check-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  background:var(--bg-color);border-radius:14px;margin-bottom:10px;
  animation:fadeIn .25s ease;
}
.check-box{
  width:24px;height:24px;border-radius:50%;border:2px solid #ccd6d1;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  margin-top:1px;cursor:pointer;transition:all .2s;
}
.check-box.done{background:var(--primary);border-color:var(--primary);color:#fff;}
.check-box svg{opacity:0;transition:opacity .2s;}
.check-box.done svg{opacity:1;}
.check-main{flex:1;min-width:0;}
.check-text{font-size:15px;line-height:1.5;color:var(--text-main);word-break:break-word;}
.check-text.done{color:#b3b3b3;text-decoration:line-through;}
.check-photo{
  width:58px;height:58px;object-fit:cover;border-radius:9px;
  margin-top:8px;display:block;border:1px solid #eee;
}
.check-meta{font-size:11px;color:#bbb;margin-top:4px;}

.add-check-row{display:flex;gap:10px;margin-bottom:16px;}
.add-check-row input{
  flex:1;padding:14px;border:1px solid #eee;background:var(--bg-color);
  border-radius:12px;font-size:15px;outline:none;
}
.add-check-row button{
  padding:0 20px;border-radius:12px;border:none;background:var(--primary);
  color:#fff;font-size:15px;cursor:pointer;
}
.check-toolbar{display:flex;gap:10px;margin-bottom:18px;}
.check-toolbar button{
  flex:1;padding:12px;border-radius:12px;font-size:14px;cursor:pointer;
  background:var(--white);color:var(--primary);border:1px solid var(--primary);
}
.check-toolbar button.ghost{color:#888;border-color:#ddd;}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  width:84%;height:56px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border-radius:28px;box-shadow:0 4px 20px rgba(0,0,0,.06);
  display:flex;justify-content:space-around;align-items:center;
  border:1px solid rgba(0,0,0,.03);z-index:20;
}
.nav-item{
  color:var(--text-muted);font-size:15px;flex:1;text-align:center;
  height:100%;line-height:56px;cursor:pointer;transition:color .2s;
}
.nav-item.active{color:var(--primary);font-weight:600;}

/* ============ 弹窗 ============ */
.modal{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);z-index:100;align-items:center;
  justify-content:center;padding:20px;
}
.modal.active{display:flex;}
.modal-content{
  background:#fff;width:100%;max-height:85vh;border-radius:var(--radius);
  padding:24px;display:flex;flex-direction:column;animation:scaleIn .25s ease;
}
@keyframes scaleIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  font-weight:600;font-size:18px;color:var(--primary);margin-bottom:15px;
}
.modal-body{
  flex:1;overflow-y:auto;font-size:15px;line-height:1.65;color:#333;
  margin-bottom:18px;
}
.modal-footer{display:flex;gap:10px;}
.modal-footer .btn-primary{flex:1;}
.modal-footer .btn-outline{flex:1;}
</style>
</head>
<body>

<div id="app">
  <div class="header" id="header-title">单词助手</div>

  <!-- ================= TAB 1 录入 ================= -->
  <div class="content active" id="tab-input">
    <div class="search-container">
      <!-- 左侧：相机/图片 -->
      <div class="icon-add" onclick="document.getElementById('imageInput').click()">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <input type="text" class="search-box" id="searchInput" placeholder="输入单词，回车生成卡片...">
      <!-- 右侧：搜索 -->
      <div class="icon-search" onclick="triggerSearch()">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
    </div>

    <textarea class="paste-box" id="batchInput"
      placeholder="批量粘贴单词，一行一个或用逗号分隔，AI 自动识别生成卡片…&#10;例如：&#10;abandon, ambitious, cognitive&#10;deteriorate"></textarea>

    <div class="btn-row">
      <button class="btn-outline" onclick="clearBatch()">清空</button>
      <button class="btn-primary" id="batchBtn" onclick="processBatch()">AI 识别生成卡片</button>
    </div>

    <div class="section-label">识别结果</div>
    <div id="recognizeStatus"><div class="empty-hint">暂无识别任务</div></div>

    <!-- 设置与统计 -->
    <div class="settings-wrapper">
      <div class="section-label" style="margin-top:0;">设置与统计</div>
      <div class="stats-box">
        <div class="stats-row"><span>API 调用次数</span><span class="stats-val" id="stat-api-calls">0</span></div>
        <div class="stats-row"><span>估算 TOKEN 量</span><span class="stats-val" id="stat-tokens">0</span></div>
        <div class="stats-row"><span>单词总数</span><span class="stats-val" id="stat-words">0</span></div>
        <div class="stats-row"><span>清单事项数</span><span class="stats-val" id="stat-checks">0</span></div>
      </div>
      
      <div class="setting-item">
        <label>DeepSeek API Key（仅本地存储）</label>
        <input type="password" id="apiKeyInput" placeholder="sk-...">
      </div>
      <button class="btn-primary" onclick="saveApiKey()" style="width:100%; margin-bottom:12px;">保存 API Key</button>
      
      <div style="display:flex; gap:10px;">
        <button class="btn-outline" style="flex:1;" onclick="exportData()">导出备份</button>
        <button class="btn-outline" style="flex:1; border-color:#ddd; color:#666;" onclick="document.getElementById('importFile').click()">导入恢复</button>
      </div>
    </div>
  </div>

  <!-- ================= TAB 2 卡片 ================= -->
  <div class="content" id="tab-cards" style="padding:0 10px 100px 10px;">
    <div class="flashcard-container" id="cardsContainer"></div>
  </div>

  <!-- ================= TAB 3 清单 ================= -->
  <div class="content" id="tab-checklist">
    <div class="clock-card">
      <div class="clock-time" id="live-clock">--:--:--</div>
      <div class="clock-date" id="live-date">--</div>
      <div class="clock-log" id="clock-log">今日暂无出入记录</div>
      <div class="clock-actions">
        <button onclick="recordOut()">🚪 记录出门</button>
        <button onclick="recordHome()">🏠 记录回家</button>
      </div>
    </div>

    <div class="add-check-row">
      <input type="text" id="checkInput" placeholder="添加清单事项，如：带钥匙 / 做 20 个单词…"
        onkeypress="if(event.key==='Enter')addCheckItem()">
      <button onclick="addCheckItem()">添加</button>
    </div>

    <div class="check-toolbar">
      <button onclick="resetChecklist()">一键循环刷新</button>
      <button class="ghost" onclick="analyzeChecklist()">AI 分析</button>
    </div>

    <div id="checklistContainer"></div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('input')">录入</div>
    <div class="nav-item" onclick="switchTab('cards')">卡片</div>
    <div class="nav-item" onclick="switchTab('checklist')">清单</div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="imageInput" accept="image/*" capture="environment"
    style="display:none;" onchange="handleImageUpload(event)">
  <input type="file" id="checklistCamera" accept="image/*" capture="environment"
    style="display:none;" onchange="handleChecklistPhoto(event)">
  <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importData(event)">

  <!-- 拍照询问弹窗 -->
  <div class="modal" id="photoModal">
    <div class="modal-content" style="max-height:none;">
      <div class="modal-header"><span>拍照记录</span></div>
      <div class="modal-body" id="photoModalBody">是否拍照记录完成情况？</div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closePhotoModal()">跳过</button>
        <button class="btn-primary" onclick="takeChecklistPhoto()">📷 拍照</button>
      </div>
    </div>
  </div>

  <!-- 信息弹窗（AI 分析等） -->
  <div class="modal" id="infoModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="infoTitle">分析</span>
        <span onclick="closeInfoModal()" style="color:#ccc;font-size:24px;line-height:1;cursor:pointer;">×</span>
      </div>
      <div class="modal-body" id="infoBody"></div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="closeInfoModal()">知道了</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   基础工具
========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowStr = () => new Date().toLocaleString('zh-CN',
  {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;

/* =========================================================
   状态
========================================================= */
let words      = JSON.parse(localStorage.getItem('wm_words') || '[]');
let checklist  = JSON.parse(localStorage.getItem('wm_checklist') || '[]');
let stats      = JSON.parse(localStorage.getItem('wm_stats') || '{"apiCalls":0,"tokens":0}');
let apiKey     = localStorage.getItem('wm_api_key') || '';
let outTs      = Number(localStorage.getItem('wm_out_ts') || 0);
let homeTs     = Number(localStorage.getItem('wm_home_ts') || 0);
let batchQueue = [];
let pendingCheckId = null;

/* =========================================================
   初始化
========================================================= */
function init(){
  $('apiKeyInput').value = apiKey;
  cleanupPhotos();
  renderCards();
  renderChecklist();
  updateStatsUI();
  tick();
  setInterval(tick, 1000);
  setInterval(() => { cleanupPhotos(); renderChecklist(); }, 60000);

  $('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') triggerSearch();
  });
}

/* =========================================================
   Tab 切换
========================================================= */
function switchTab(tabId){
  document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  $('tab-' + tabId).classList.add('active');

  const navs = document.querySelectorAll('.nav-item');
  const map = {input:0, cards:1, checklist:2};
  navs[map[tabId]].classList.add('active');

  const titles = {input:'单词录入', cards:'记忆卡片', checklist:'出行清单'};
  $('header-title').innerText = titles[tabId];

  if (tabId === 'cards') renderCards();
  if (tabId === 'checklist') { cleanupPhotos(); renderChecklist(); }
  if (tabId === 'input') updateStatsUI();
}

/* =========================================================
   通用 API 调用
========================================================= */
async function callAI(messages){
  const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
    body: JSON.stringify({model:'deepseek-chat', messages, temperature:0.6})
  });
  const data = await res.json();
  stats.apiCalls++;
  stats.tokens += Math.round(JSON.stringify(messages).length / 2) + 300;
  saveStats();
  if (!data.choices || !data.choices.length){
    throw new Error((data.error && data.error.message) || 'API 返回异常');
  }
  return data.choices[0].message.content;
}

/* =========================================================
   批量处理
========================================================= */
function triggerSearch() {
    const val = $('searchInput').value.trim();
    if (!val) return;
    $('searchInput').value = '';
    $('searchInput').blur();
    $('batchInput').value = val;
    processBatch();
}

function clearBatch() {
    $('batchInput').value = '';
    $('batchInput').focus();
}

function processBatch() {
    const text = $('batchInput').value.trim();
    if (!text) { alert('请先输入或粘贴单词'); return; }
    const wordsArr = text.split(/[\n,，]+/).map(w => w.trim()).filter(w => w);
    const uniqueWords = [...new Set(wordsArr)];
    if (uniqueWords.length === 0) return;
    
    $('batchInput').value = '';
    $('recognizeStatus').innerHTML = '';
    
    batchQueue = [...uniqueWords];
    processNextInQueue();
}

function processNextInQueue() {
    if (batchQueue.length === 0) {
        updateStatsUI();
        return;
    }
    const word = batchQueue.shift();
    addStatusItem(word, 'loading', '生成中...');
    generateWordCard(word).then(() => {
        updateStatusItem(word, 'done', '已完成');
        processNextInQueue();
    }).catch(err => {
        updateStatusItem(word, 'fail', err.message || '失败');
        processNextInQueue();
    });
}

function addStatusItem(word, type, msg) {
    const container = $('recognizeStatus');
    if (container.querySelector('.empty-hint')) container.innerHTML = '';
    
    const id = 'st_' + word.replace(/[^a-zA-Z0-9]/g, '_');
    if ($(id)) $(id).remove();
    
    const div = document.createElement('div');
    div.className = 'status-item';
    div.id = id;
    div.innerHTML = `
        <div class="dot ${type}"></div>
        <div class="st-word">${esc(word)}</div>
        <div class="st-msg">${esc(msg)}</div>
    `;
    container.prepend(div);
}

function updateStatusItem(word, type, msg) {
    const id = 'st_' + word.replace(/[^a-zA-Z0-9]/g, '_');
    const item = $(id);
    if (item) {
        item.querySelector('.dot').className = 'dot ' + type;
        item.querySelector('.st-msg').innerText = msg;
    }
}

/* =========================================================
   单词卡生成
========================================================= */
async function generateWordCard(word) {
    if (!apiKey) {
        await new Promise(r => setTimeout(r, 600));
        const mock = {
            word: word,
            phonetic: '/ˈmɒk/',
            syllable: 'mock',
            collins: 'adj. 模拟的；n. 模拟数据',
            cn: 'n. 模拟数据；adj. 模拟的',
            example: 'This is a mock example for testing.',
            syn: 'fake, artificial',
            ant: 'real, authentic'
        };
        saveWord(mock);
        return;
    }
    
    const prompt = `请为我生成单词 "${word}" 的详细记忆卡片，严格按照以下JSON格式输出，不要输出任何其他多余内容：
{
"word": "${word}",
"phonetic": "音标",
"syllable": "音节拆分（用点连接）",
"collins": "柯林斯英文释义",
"cn": "中文释义",
"example": "英文例句（附带中文翻译）",
"syn": "同义词",
"ant": "反义词"
}`;
    
    const res = await callAI([{role: 'user', content: prompt}]);
    try {
        const jsonStr = res.replace(/```json/g, '').replace(/```/g, '').trim();
        const data = JSON.parse(jsonStr);
        saveWord(data);
    } catch (e) {
        throw new Error('AI 解析失败');
    }
}

function saveWord(data) {
    if (words.find(w => w.word.toLowerCase() === data.word.toLowerCase())) return;
    data.id = Date.now();
    data.time = nowStr();
    words.push(data);
    localStorage.setItem('wm_words', JSON.stringify(words));
    renderCards();
}

/* =========================================================
   渲染单词卡
========================================================= */
function renderCards() {
    const container = $('cardsContainer');
    if (words.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无卡片，快去录入单词吧~</div>';
        return;
    }
    
    const sorted = [...words].reverse();
    container.innerHTML = sorted.map(w => {
        return `
        <div class="flashcard">
            <div class="card-header">
                <div>
                    <div class="word-big">${esc(w.word)}</div>
                    ${w.phonetic ? `<div class="word-phonetic">${esc(w.phonetic)}</div>` : ''}
                    ${w.syllable ? `<div class="word-syllable">${esc(w.syllable)}</div>` : ''}
                </div>
                <button class="delete-btn" onclick="deleteWord(${w.id})">删除</button>
            </div>
            <div class="card-body">
                ${w.collins ? `<div class="sec"><div class="sec-label">柯林斯释义</div><div class="sec-body en">${esc(w.collins)}</div></div>` : ''}
                ${w.cn ? `<div class="sec"><div class="sec-label">中文释义</div><div class="sec-body">${esc(w.cn)}</div></div>` : ''}
                ${w.example ? `<div class="sec"><div class="sec-label">例句</div><div class="sec-body en">${esc(w.example)}</div></div>` : ''}
                ${w.syn ? `<div class="sec"><div class="sec-label">同义词</div><div class="sec-body">${esc(w.syn)}</div></div>` : ''}
                ${w.ant ? `<div class="sec"><div class="sec-label">反义词</div><div class="sec-body">${esc(w.ant)}</div></div>` : ''}
            </div>
            <div class="card-footer">${esc(w.time || '')}</div>
        </div>`;
    }).join('');
}

function deleteWord(id) {
    if (!confirm('确定删除这张单词卡吗？')) return;
    words = words.filter(w => w.id !== id);
    localStorage.setItem('wm_words', JSON.stringify(words));
    renderCards();
    updateStatsUI();
}

/* =========================================================
   图片上传（模拟）
========================================================= */
function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        $('batchInput').value = 'abandon, cognitive';
        event.target.value = '';
        alert('图片已识别，单词已填入下方输入框，请点击“AI 识别生成卡片”。');
    };
    reader.readAsDataURL(file);
}

/* =========================================================
   清单相关
========================================================= */
function cleanupPhotos() {
    const now = Date.now();
    let changed = false;
    checklist.forEach(item => {
        if (item.photo && item.photoTs && now - item.photoTs > THREE_DAYS) {
            delete item.photo;
            delete item.photoTs;
            changed = true;
        }
    });
    if (changed) {
        localStorage.setItem('wm_checklist', JSON.stringify(checklist));
    }
}

function renderChecklist() {
    const container = $('checklistContainer');
    if (checklist.length === 0) {
        container.innerHTML = '<div class="empty-hint">暂无清单，添加一项吧</div>';
        return;
    }
    
    container.innerHTML = checklist.map(item => {
        let photoHtml = '';
        if (item.photo) {
            photoHtml = `<img src="${item.photo}" class="check-photo">`;
        }
        let metaHtml = '';
        if (item.doneTime) {
            metaHtml = `<div class="check-meta">完成于 ${item.doneTime}</div>`;
        }
        
        return `
        <div class="check-item">
            <div class="check-box ${item.done ? 'done' : ''}" onclick="toggleCheck(${item.id})">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="3" fill="none">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="check-main">
                <div class="check-text ${item.done ? 'done' : ''}">${esc(item.text)}</div>
                ${photoHtml}
                ${metaHtml}
            </div>
            <button class="delete-btn" onclick="deleteCheckItem(${item.id})">删除</button>
        </div>`;
    }).join('');
}

function addCheckItem() {
    const text = $('checkInput').value.trim();
    if (!text) return;
    checklist.push({ id: Date.now(), text, done: false });
    $('checkInput').value = '';
    saveChecklist();
    renderChecklist();
}

function deleteCheckItem(id) {
    if (!confirm('删除此事项？')) return;
    checklist = checklist.filter(i => i.id !== id);
    saveChecklist();
    renderChecklist();
}

function toggleCheck(id) {
    const item = checklist.find(i => i.id === id);
    if (!item) return;
    if (item.done) {
        item.done = false;
        delete item.doneTime;
        delete item.photo;
        delete item.photoTs;
        saveChecklist();
        renderChecklist();
    } else {
        pendingCheckId = id;
        $('photoModal').classList.add('active');
        $('photoModalBody').innerText = `"${item.text}" 已完成，是否拍照记录？`;
    }
}

function saveChecklist() {
    localStorage.setItem('wm_checklist', JSON.stringify(checklist));
    updateStatsUI();
}

function resetChecklist() {
    checklist.forEach(item => {
        item.done = false;
        delete item.doneTime;
    });
    saveChecklist();
    renderChecklist();
    alert('已一键刷新完成状态');
}

function closePhotoModal() {
    $('photoModal').classList.remove('active');
    pendingCheckId = null;
}

function takeChecklistPhoto() {
    $('checklistCamera').click();
    closePhotoModal();
}

function handleChecklistPhoto(event) {
    const file = event.target.files[0];
    if (!file || !pendingCheckId) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = e.target.result;
        const item = checklist.find(i => i.id === pendingCheckId);
        if (item) {
            item.done = true;
            item.doneTime = nowStr();
            item.photo = base64;
            item.photoTs = Date.now();
            saveChecklist();
            renderChecklist();
        }
        event.target.value = '';
        pendingCheckId = null;
    };
    reader.readAsDataURL(file);
}

async function analyzeChecklist() {
    const pending = checklist.filter(i => !i.done);
    const done = checklist.filter(i => i.done);
    if (checklist.length === 0) { alert('清单为空'); return; }
    
    $('infoTitle').innerText = 'AI 清单分析';
    $('infoBody').innerHTML = '<div style="text-align:center;padding:20px;color:#888;">正在分析...</div>';
    $('infoModal').classList.add('active');
    
    if (!apiKey) {
        setTimeout(() => {
            $('infoBody').innerHTML = `
                <p><strong>模拟分析结果：</strong></p>
                <p>您共有 ${done.length} 项已完成，${pending.length} 项待办。</p>
                <p>${pending.length > 0 ? '未完成事项：' + pending.map(p=>p.text).join('、') : '所有事项均已完成，太棒了！'}</p>
                <p style="color:#999;font-size:12px;margin-top:10px;">(未配置API Key，此为模拟数据)</p>
            `;
        }, 800);
        return;
    }
    
    const prompt = `我有一份出行清单，状态如下：
已完成：${done.map(d=>d.text).join('、') || '无'}
待办：${pending.map(p=>p.text).join('、') || '无'}
请给我一段简短的分析或提醒（100字以内），以HTML段落格式输出。`;
    
    try {
        const res = await callAI([{role: 'user', content: prompt}]);
        $('infoBody').innerHTML = res.replace(/\n/g, '<br>');
    } catch (e) {
        $('infoBody').innerHTML = `<span style="color:red;">分析失败：${e.message}</span>`;
    }
}

function closeInfoModal() {
    $('infoModal').classList.remove('active');
}

/* =========================================================
   时钟与记录
========================================================= */
function recordOut() {
    outTs = Date.now();
    localStorage.setItem('wm_out_ts', outTs);
    tick();
}

function recordHome() {
    homeTs = Date.now();
    localStorage.setItem('wm_home_ts', homeTs);
    tick();
}

function tick() {
    const d = new Date();
    $('live-clock').innerText = d.toLocaleTimeString('zh-CN', {hour12:false});
    $('live-date').innerText = d.toLocaleDateString('zh-CN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    
    let log = '';
    const fmt = ts => {
        if (!ts) return '--:--';
        const date = new Date(ts);
        return date.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    };
    
    if (outTs || homeTs) {
        log = `出门：${fmt(outTs)} | 回家：${fmt(homeTs)}`;
        if (outTs && homeTs && homeTs > outTs) {
            const diff = Math.floor((homeTs - outTs) / 60000);
            log += `<br>在外时长：${Math.floor(diff/60)} 小时 ${diff%60} 分钟`;
        } else if (outTs && (!homeTs || homeTs < outTs)) {
            const diff = Math.floor((Date.now() - outTs) / 60000);
            log += `<br>已出门：${Math.floor(diff/60)} 小时 ${diff%60} 分钟`;
        }
    } else {
        log = '今日暂无出入记录';
    }
    $('clock-log').innerHTML = log;
}

/* =========================================================
   设置与导入导出
========================================================= */
function saveApiKey() {
    apiKey = $('apiKeyInput').value.trim();
    localStorage.setItem('wm_api_key', apiKey);
    alert('API Key 已保存');
}

function updateStatsUI() {
    $('stat-api-calls').innerText = stats.apiCalls;
    $('stat-tokens').innerText = stats.tokens;
    $('stat-words').innerText = words.length;
    $('stat-checks').innerText = checklist.length;
}

function saveStats() {
    localStorage.setItem('wm_stats', JSON.stringify(stats));
    updateStatsUI();
}

function exportData() {
    const data = { words, checklist, stats, exportTime: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `word_memory_backup_${new Date().getTime()}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.words && data.checklist) {
                words = data.words;
                checklist = data.checklist;
                stats = data.stats || {apiCalls:0, tokens:0};
                localStorage.setItem('wm_words', JSON.stringify(words));
                localStorage.setItem('wm_checklist', JSON.stringify(checklist));
                localStorage.setItem('wm_stats', JSON.stringify(stats));
                renderCards();
                renderChecklist();
                updateStatsUI();
                alert('数据恢复成功！');
            } else {
                alert('文件格式不正确');
            }
        } catch (err) {
            alert('读取文件失败');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

/* 启动 */
init();
</script>
</body>
</html>
